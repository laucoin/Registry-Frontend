worker_processes  1;

events {
  worker_connections  1024;
}

pid /tmp/nginx.pid;

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include /etc/nginx/conf.d/backend-origin.conf;

  server {
    listen 8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    include /etc/nginx/mime.types;
    absolute_redirect off;
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Durcissement
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    # Désactivé explicitement plutôt qu'omis : l'ancien filtre anti-XSS réfléchi qu'il pilote a disparu
    # de tous les moteurs modernes, et l'activer (« 1; mode=block ») a lui-même causé des failles XSS dans
    # d'anciennes versions de WebKit et Blink. La vraie protection est désormais la CSP.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # connect-src : l'origine du backend ($backend_origin) est lue au démarrage du conteneur dans le env.json injecté
    # (docker/40-backend-origin.sh) ; sans URL lisible, elle retombe sur toute origine https:.
    # Nonce par requête ($request_id) : Angular le lit sur la racine (ngCspNonce, posé par sub_filter dans index.html) et
    # le met sur les balises <style> qu'il injecte ; @sgdf/ui passe par adoptedStyleSheets, que la CSP ne bloque pas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' $backend_origin; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    server_tokens off;

    # Un fichier JSON absent (settings, i18n) doit répondre 404, et non le repli index.html servi en 200.
    # `expires -1` envoie no-cache sans remplacer les en-têtes de sécurité ci-dessus (un add_header de location le ferait).
    location ~ \.json$ {
      expires -1;
      try_files $uri =404;
    }

    location = /index.html {
      expires -1;
      sub_filter_once off;
      sub_filter '__CSP_NONCE__' '$request_id';
    }

    location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
      expires 1y;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

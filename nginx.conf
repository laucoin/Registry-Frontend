worker_processes  1;

events {
  worker_connections  1024;
}

pid /tmp/nginx.pid;

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_disable "msie6";
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;


    # Hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    # Explicitly disabled rather than omitted: the legacy reflected-XSS auditor this controls has
    # been removed from every modern browser engine, and enabling it ("1; mode=block") has itself
    # been a source of XSS in older WebKit/Blink builds. CSP is the real protection now.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # connect-src allows any https origin (not just 'self') because the backend origin is
    # injected at runtime via public/settings/env.json and isn't known when this file is built.
    # script-src needs 'unsafe-eval': @ngxs/store compiles its state selectors via `new Function(...)`
    # at runtime (NgxsSelectorUtils) — verified against dist/browser, no eval/Function usage in app code itself.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    server_tokens off;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

worker_processes  1;

events {
  worker_connections  1024;
}

pid /tmp/nginx.pid;

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_disable "msie6";
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;


    # Hardening.
    #
    # The document's own protection is the Content-Security-Policy declared in index.html, so that it
    # is versioned with the code rather than with the web server. What stays here is what a <meta>
    # policy cannot express: frame-ancestors is ignored in <meta> by the CSP specification, so
    # X-Frame-Options remains the SPA's only clickjacking defence and must not be removed with the
    # rest. HSTS and nosniff are likewise headers, not policy directives.
    #
    # X-XSS-Protection, X-Download-Options and X-Permitted-Cross-Domain-Policies were dropped: all
    # three are obsolete, and the first is actively harmful in the browsers that still honour it.
    #
    # Add nothing below without checking every `location`: add_header does not merge across contexts,
    # so a single add_header in a location silently discards every header set at this level.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
    add_header X-Content-Type-Options nosniff;
    server_tokens off;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

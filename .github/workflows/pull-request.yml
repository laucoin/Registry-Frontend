name: Pull Request

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  verify:
    name: Lint, typecheck, test & publish branch image
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - name: Set up Node (with pnpm store cache)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # vue-tsc over the generated .nuxt tsconfig, so template expressions and
      # SFC props are checked too — eslint and vitest both miss those.
      - name: Typecheck
        run: pnpm typecheck

      # vitest, includes the axe a11y gate.
      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

      - name: Compute branch image tag
        id: tag
        run: |
          echo "value=$(echo '${{ github.head_ref }}' \
            | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The Dockerfile is self-contained (multi-stage: pnpm install + nuxt build
      # inside the image), so this is also the build gate — no host build needed.
      - name: Build & push branch image
        uses: ./.github/actions/docker-publish
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tag: ${{ steps.tag.outputs.value }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

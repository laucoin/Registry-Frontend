name: Release

# Runs on every merge to main (the DEV baseline). Tests are intentionally not
# run here — branch protection guarantees the PR pipeline already validated it.
on:
  push:
    branches: [ main ]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  dev-image:
    name: Build & push DEV (main) image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BACKEND_URL: http://build-placeholder.invalid
          ORGANIZATION_NAME: build-placeholder
          CREATOR_NAME: build-placeholder
          CREATOR_EMAIL: build-placeholder@example.com
          NODE_OPTIONS: --dns-result-order=ipv4first
      - uses: ./.github/actions/docker-publish
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tag: main
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: "24"
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/npm
            @semantic-release/git
            @semantic-release/release-notes-generator@14.1.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release-image:
    name: Build & push release (x.y.z) image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main             # pick up the package.json version bump just pushed
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BACKEND_URL: http://build-placeholder.invalid
          ORGANIZATION_NAME: build-placeholder
          CREATOR_NAME: build-placeholder
          CREATOR_EMAIL: build-placeholder@example.com
          # See Dockerfile's build stage: the route-extraction step binds a throwaway
          # server to `localhost`, then self-probes it by URL over `localhost` too — on
          # a dual-stack glibc/Linux host those two DNS lookups can disagree (::1 vs
          # 127.0.0.1), so the self-probe connects to a socket nothing is listening on.
          NODE_OPTIONS: --dns-result-order=ipv4first
      - uses: ./.github/actions/docker-publish
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tag: ${{ needs.release.outputs.version }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

  retention:
    name: Apply retention policy
    runs-on: ubuntu-latest
    needs: release-image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/registry-retention
        with:
          package-name: ${{ env.IMAGE_NAME }}
          owner: ${{ github.repository_owner }}
          keep-releases: "5"
          token: ${{ secrets.GHCR_PAT }}

<p-dialog
        (close)='closeLayer.emit($event)'
        [header]='header()'
        modal
        dismissableMask
        [draggable]='false'
        [resizable]='false'
        [(visible)]='visible'
        [position]='registryFacade.tinyScreen() ? "bottom" : "right"'
        [style]='dialogStyle'>
    <ng-content />
    <ng-template #footer>
        <ng-container [ngTemplateOutlet]='getTemplate("footer")' />
    </ng-template>
</p-dialog>

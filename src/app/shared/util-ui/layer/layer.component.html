<p-dialog
        (close)='closeLayer.emit($event)'
        [header]='header'
        [modal]='true'
        [dismissableMask]='true'
        [draggable]='false'
        [resizable]='false'
        [(visible)]='visible'
        [position]='isTinyScreen() ? "bottom" : "right"'
        [style]='dialogStyle'>
    <ng-content />
    <ng-template pTemplate='footer'>
        <ng-container [ngTemplateOutlet]='getTemplate("footer")' />
    </ng-template>
</p-dialog>

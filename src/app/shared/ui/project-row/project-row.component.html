<a class="project" [routerLink]="['/projects', id(), 'home']">
	@if (isFavorite() !== null) {
		<button
			type="button"
			class="favorite"
			[class.active]="isFavorite()"
			[attr.aria-label]="'home.projectRow.toggleFavorite' | transloco"
			(click)="onToggleFavorite($event)"
		>
			<svg lucideStar></svg>
		</button>
	}
	<div class="project-text">
		<h3>{{ name() }}</h3>
		@if (counts(); as counts) {
			@if (countsLabel(counts); as label) {
				<p class="counts">{{ label }}</p>
			}
		}
		@if (options(); as options) {
			<p class="options">{{ optionsLabel(options) }}</p>
		}
	</div>
	<ng-content />
</a>

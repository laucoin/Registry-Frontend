<p-inputgroup [id]='inputId()' [class.invalid]='invalid()'>
    <p-inputgroup-addon>{{ minLabel() }}</p-inputgroup-addon>
    <p-input-number inputId='min' [(ngModel)]='minValue' inputmode='numeric' (onInput)='onInputMin($event.value)'
                    [placeholder]='minPlaceholder()' />
    <p-inputgroup-addon>{{ maxLabel() }}</p-inputgroup-addon>
    <p-input-number inputId='max'
                    [(ngModel)]='maxValue'
                    inputmode='numeric'
                    (onInput)='onInputMax($event.value)'
                    [placeholder]='maxPlaceholder()' />
    <p-inputgroup-addon>
        <p-button icon='pi pi-times' severity='secondary' (onClick)='onInputChange(undefined, undefined); minValue = undefined;
        maxValue = undefined' />
    </p-inputgroup-addon>
</p-inputgroup>

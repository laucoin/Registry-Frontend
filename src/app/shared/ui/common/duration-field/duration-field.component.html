<p-select [options]='durations'
          optionLabel='label'
          optionValue='value'
          [class.invalid]='showInvalid()'
          [ngModel]='value()'
          (onChange)='onInputChange($event.value)'
          [inputId]='inputId()'
          [placeholder]='placeholder()'
          [disabled]='disabled()'
          [fluid]='fluid()' />

<form data-test-id="form-dialog-form" novalidate (submit)="$event.preventDefault(); submitted.emit()">
	<sgdf-dialog data-test-id="form-dialog-modal" open [title]="title() ?? ''" (sgdf-hide)="hidden($event)">
		@if (loading()) {
			<div class="flex justify-center">
				<sgdf-spinner data-test-id="form-dialog-spinner" />
			</div>
		} @else {
			<div class="flex flex-col gap-3 text-left">
				<app-form-error data-test-id="form-dialog-error" [error]="error()" />
				<ng-content />
			</div>
		}
		<sgdf-button
			data-test-id="form-dialog-cancel-button"
			slot="footer"
			variant="neutral"
			appearance="text"
			(click)="closed.emit()"
		>
			{{ 'global.actions.cancel' | transloco }}
		</sgdf-button>
		<sgdf-button
			data-test-id="form-dialog-submit"
			slot="footer"
			variant="primary"
			submit
			[loading]="saving()"
			[disabled]="loading()"
		>
			<sgdf-icon slot="prefix" [name]="submitIcon()" library="solid" />
			{{ submitLabel() | transloco }}
		</sgdf-button>
	</sgdf-dialog>
</form>

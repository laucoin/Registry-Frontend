@if (registryFacade.theme()) {
    <p-tag [severity]='registryFacade.theme() === "dark" ? undefined : "secondary"'>
        @if (severity()) {
            <app-severity-circle [severity]='severity()' />
        }
        @if (value()) {
            <span>{{ value() }}</span>
        } @else {
            <ng-content />
        }
    </p-tag>
}

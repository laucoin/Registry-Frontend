<sgdf-select with-search without-filter
             [label]="label()"
             [hint]="hint()"
             [disabled]="disabled()"
             [loading]="loading()"
             [placeholder]="placeholder()"
             [attr.no-results-label]="emptyMessage()"
             (sgdf-show)="handleSearch.emit({ query: '' })"
             (sgdf-search)="handleSearch.emit({ query: $any($event).detail.query })"
             (change)="handleChoice($event)">
    @for (suggestion of suggestions(); track suggestion.value.id) {
        <sgdf-option [value]="suggestion.value.id">{{ suggestion.label }}</sgdf-option>
    }
</sgdf-select>
@if (selectionLabel()) {
    <div class="mt-[0.75rem] text-sm font-semibold" aria-hidden="true">{{ selectionLabel() }}</div>
}
<sgdf-list class="mt-[0.25rem] block" [attr.label]="selectionLabel()">
    @for (element of value(); track element.id) {
        <sgdf-list-item [attr.data-value]="element.id">
            {{ selectItemBuilder()(element).label }}
            <sgdf-icon-button slot="end" name="xmark" library="solid"
                              [attr.label]="'global.actions.remove-named' | transloco : { name: selectItemBuilder()(element).label }"
                              [disabled]="disabled()"
                              (click)="handleElementRemoving(element.id)"/>
        </sgdf-list-item>
    } @empty {
        <p class="m-0 p-[0.75rem] text-sm">{{ emptySelectionMessage() }}</p>
    }
</sgdf-list>
<span class="sr-only" role="status">{{ announcement() }}</span>

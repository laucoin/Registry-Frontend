<div class="flex flex-col items-center gap-(--spacing--in-block)">
	<small data-test-id="load-more-count" class="opacity-80" aria-hidden="true">
		{{ 'global.list.loaded-count' | transloco: { count: loadedCount(), total: total() } }}
	</small>
	<span class="sr-only" role="status">
		{{ 'global.list.loaded-count' | transloco: { count: loadedCount(), total: total() } }}
	</span>
	<div #sentinel aria-hidden="true" class="h-px w-full"></div>
	<sgdf-button
		data-test-id="load-more-load-more-button"
		appearance="outlined"
		[loading]="loading()"
		(click)="loadMore.emit()"
	>
		{{ 'global.list.load-more' | transloco }}
	</sgdf-button>
</div>

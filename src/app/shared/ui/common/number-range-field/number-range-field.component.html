@if (label()) {
	<div class="mb-1 text-sm font-semibold" aria-hidden="true">{{ label() }}</div>
}
<div role="group" class="grid grid-cols-2 gap-3" [attr.id]="inputId()" [attr.aria-label]="label()">
	<sgdf-number-input
		data-test-id="number-range-field-min-input"
		without-steppers
		with-clear
		[label]="minLabel()"
		[placeholder]="minPlaceholder()"
		[attr.error]="error() ?? ''"
		[disabled]="disabled()"
		[value]="minValue()?.toString() ?? ''"
		(input)="onInputMin($any($event.target).value || null)"
		(focusout)="touch.emit()"
	/>
	<sgdf-number-input
		data-test-id="number-range-field-max-input"
		without-steppers
		with-clear
		[label]="maxLabel()"
		[placeholder]="maxPlaceholder()"
		[disabled]="disabled()"
		[value]="maxValue()?.toString() ?? ''"
		(input)="onInputMax($any($event.target).value || null)"
		(focusout)="touch.emit()"
	/>
</div>

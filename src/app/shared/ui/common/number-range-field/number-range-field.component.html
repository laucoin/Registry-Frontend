@if (label()) {
    <div class="mb-[0.25rem] text-sm font-semibold" aria-hidden="true">{{ label() }}</div>
}
<div role="group" class="grid grid-cols-2 gap-[0.75rem]" [attr.id]="inputId()" [attr.aria-label]="label()">
    <sgdf-number-input without-steppers with-clear
                       [label]="minLabel()"
                       [placeholder]="minPlaceholder()"
                       [disabled]="disabled()"
                       [value]="minValue()?.toString() ?? ''"
                       (input)="onInputMin($any($event.target).value || null)"
                       (focusout)="touch.emit()"/>
    <sgdf-number-input without-steppers with-clear
                       [label]="maxLabel()"
                       [placeholder]="maxPlaceholder()"
                       [disabled]="disabled()"
                       [value]="maxValue()?.toString() ?? ''"
                       (input)="onInputMax($any($event.target).value || null)"
                       (focusout)="touch.emit()"/>
</div>

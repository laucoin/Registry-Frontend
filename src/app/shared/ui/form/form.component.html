@if (form().untouched && loading()) {
    <div class='d-flex justify-content-center'>
        <p-progress-spinner></p-progress-spinner>
    </div>
} @else {
    @if (title() && showTitle()) {
        <h2>{{ title() }}</h2>
    }
    @if (error(); as error) {
        <p-message severity='error' class='d-block mb-2' role='alert'>
            <strong>{{ error.title! | translate }}</strong>
            <div>{{ error.message | translate }}</div>
        </p-message>
    }
    <ng-content/>
}

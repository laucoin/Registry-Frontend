<div class="messages" role="log" aria-live="polite" [appConversationScroll]="communications()" (loadOlder)="loadOlder()">
    @for (communication of communications(); track communication.id; ) {
        <app-dialog-element [communication]='communication'
                            [alertVisible]='true'
                            [previousAuthorId]='getPreviousAuthorId($index)'
                            [nextAuthorId]='getNextAuthorId($index)' />
    }
</div>

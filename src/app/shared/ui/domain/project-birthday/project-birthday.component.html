<sgdf-table class="h-full [&::part(grid)]:h-full [&::part(grid)]:table-fixed" appearance="soft">
    <sgdf-table-row>
        <sgdf-table-cell header class="flex items-center gap-1">
            <sgdf-icon name="cake-candles" library="solid"/>
            <h2 class="text-sm font-semibold uppercase">{{ 'projectHome.birthday.title' | transloco }}</h2>
            <sgdf-tag class="ml-auto" size="small" variant="info" appearance="soft">{{ birthdays.length }}</sgdf-tag>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row>
        <sgdf-table-cell class="h-full p-0 align-top">
            <sgdf-list appearance="text" [label]="'projectHome.birthday.title' | transloco">
                @for (birthday of birthdays; track birthday.name) {
                    <sgdf-list-item>
                        <sgdf-avatar slot="start" variant="warning" aria-hidden="true">
                            <sgdf-icon slot="icon" name="cake-candles" library="solid"/>
                        </sgdf-avatar>
                        {{ birthday.name }}
                        <span slot="description" class="text-xs">
                            {{ 'projectHome.birthday.age' | transloco: { count: birthday.age } }} · {{ birthday.detail }}
                        </span>
                    </sgdf-list-item>
                }
            </sgdf-list>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row>
        <sgdf-table-cell class="align-bottom">
            <sgdf-button block size="small" appearance="text">{{ 'projectHome.seeMore' | transloco }}</sgdf-button>
        </sgdf-table-cell>
    </sgdf-table-row>
</sgdf-table>

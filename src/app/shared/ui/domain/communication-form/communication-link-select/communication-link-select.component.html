<div class="flex flex-col gap-1">
	<span class="font-semibold" aria-hidden="true">{{ label() }}</span>
	<div class="flex items-center gap-2">
		<sgdf-select
			data-test-id="communication-link-select-select"
			class="min-w-0 flex-1"
			without-label
			with-search
			without-filter
			placement="top"
			[label]="label()"
			[placeholder]="placeholder()"
			[attr.no-results-label]="emptyLabel()"
			[appFieldError]="field()"
			[translationPrefix]="translationPrefix()"
			[value]="selectedKey()"
			(sgdf-search)="searched.emit($any($event).detail)"
			(change)="selected.emit($any($event.target).value)"
			(focusout)="left.emit()"
		>
			@for (option of choices(); track option.value.id) {
				<sgdf-option [value]="option.value.id">{{ option.label }}</sgdf-option>
			}
		</sgdf-select>
		<sgdf-icon-button
			data-test-id="communication-link-select-remove-button"
			name="xmark"
			library="solid"
			variant="danger"
			[label]="removeLabel()"
			(click)="removed.emit()"
		/>
	</div>
</div>

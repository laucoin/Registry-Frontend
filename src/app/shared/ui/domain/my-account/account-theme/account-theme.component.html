<sgdf-table class="h-full [&::part(grid)]:h-full" appearance="soft">
    <sgdf-table-row>
        <sgdf-table-cell header class="flex items-center gap-1">
            <sgdf-icon name="palette" library="solid"/>
            <h2>{{ 'myAccount.theme.title' | transloco }}</h2>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row>
        <sgdf-table-cell row-header>
            <sgdf-radio-group data-testid="account-theme-choices-group" appearance="segmented" without-label
                              [label]="'myAccount.theme.choose' | transloco"
                              [value]="currentTheme()"
                              (change)="select($any($event.target).value)">
                @for (choice of choices; track choice.theme) {
                    <sgdf-radio data-testid="account-theme-choice-radio" [value]="choice.theme">
                        <sgdf-icon class="max-sm:hidden" [name]="choice.icon" library="solid"/>
                        {{ choice.labelKey | transloco }}
                    </sgdf-radio>
                }
            </sgdf-radio-group>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row class="h-full">
        <sgdf-table-cell class="align-bottom text-sm opacity-80">
            {{ 'myAccount.theme.hint' | transloco }}
        </sgdf-table-cell>
    </sgdf-table-row>
</sgdf-table>

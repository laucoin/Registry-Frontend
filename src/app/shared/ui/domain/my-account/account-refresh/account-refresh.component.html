<sgdf-table class="h-full [&::part(grid)]:h-full" appearance="soft">
    <sgdf-table-row>
        <sgdf-table-cell header class="flex items-center gap-1">
            <sgdf-icon name="rotate" library="solid"/>
            <h2>{{ 'myAccount.refresh.title' | transloco }}</h2>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row>
        <sgdf-table-cell row-header>
            <sgdf-button-group class="flex w-full" [label]="'myAccount.refresh.choose' | transloco">
                @for (choice of choices; track choice.mode) {
                    <sgdf-button class="flex-1" variant="primary"
                                 block
                                 [appearance]="choice.mode === currentMode() ? 'solid' : 'outlined'"
                                 [attr.aria-pressed]="choice.mode === currentMode()"
                                 (click)="select(choice.mode)">
                        {{ choice.labelKey | transloco }}
                        @if (choice.mode === currentMode()) {
                            <span class="sr-only">({{ 'myAccount.selected' | transloco }})</span>
                        }
                    </sgdf-button>
                }
            </sgdf-button-group>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row class="h-full">
        <sgdf-table-cell class="align-bottom text-xs opacity-80">
            {{ 'myAccount.refresh.hint' | transloco }}
        </sgdf-table-cell>
    </sgdf-table-row>
</sgdf-table>

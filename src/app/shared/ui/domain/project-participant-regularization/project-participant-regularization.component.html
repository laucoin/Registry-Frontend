<sgdf-table class="h-full [&::part(grid)]:h-full [&::part(grid)]:table-fixed" appearance="soft">
    <sgdf-table-row>
        <sgdf-table-cell header class="flex items-center gap-1">
            <sgdf-icon name="clock" library="solid"/>
            <h2 class="text-sm font-semibold uppercase">{{ 'projectHome.participantRegularization.title' | transloco }}</h2>
            <sgdf-tag class="ml-auto" size="small" variant="info" appearance="soft">{{ participants.length }}</sgdf-tag>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row>
        <sgdf-table-cell class="h-full p-0 align-top">
            <sgdf-list appearance="text" [label]="'projectHome.participantRegularization.title' | transloco">
                @for (participant of participants; track participant.name) {
                    <sgdf-list-item>
                        <sgdf-avatar slot="start" variant="warning" aria-hidden="true">
                            <sgdf-icon slot="icon" name="clock" library="solid"/>
                        </sgdf-avatar>
                        {{ participant.name }}
                        <span slot="description" class="text-xs">{{ participant.detail }}</span>
                    </sgdf-list-item>
                }
            </sgdf-list>
        </sgdf-table-cell>
    </sgdf-table-row>

    <sgdf-table-row>
        <sgdf-table-cell class="align-bottom">
            <sgdf-button block size="small" appearance="text">
                {{ 'projectHome.participantRegularization.seeAll' | transloco }}
            </sgdf-button>
        </sgdf-table-cell>
    </sgdf-table-row>
</sgdf-table>

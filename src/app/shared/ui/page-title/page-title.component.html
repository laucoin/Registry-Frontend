<section>
	<div class="title-content">
		@if (showBackButton()) {
			<div class="back-button">
				<button type="button" class="btn-link" (click)="onBackButtonClick()">
					<svg lucideArrowLeft size="1rem"></svg>
					{{ backButtonLabel() }}
				</button>
			</div>
		}
		<p class="eyebrow">{{ eyebrow() }}</p>
		<h1>{{ title() }}</h1>
		<p class="lede">
			{{ lede() }}
		</p>
	</div>
	<div class="title-actions">
		<ng-content />
	</div>
</section>

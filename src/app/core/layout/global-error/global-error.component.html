<main class="flex min-h-screen items-center justify-center px-8 py-12">
    <section class="flex w-full max-w-xl flex-col items-start gap-6">
        <sgdf-page-title [eyebrow]="'global.error.eyebrow' | transloco" [lede]="'global.error.description' | transloco">
            {{ 'global.error.title' | transloco }}
        </sgdf-page-title>
        <sgdf-callout class="w-full" variant="danger" role="alert"
                      [title]="!!error().summary ? error().summary : 'global.notifications.UNKNOWN_ERROR.title' | transloco">
            <div class="flex flex-col gap-2">
                <small class="uppercase text-xs opacity-80">{{ 'global.error.cause' | transloco }}</small>
                <span>
                    @if (error().detail; as detail) {
                        {{ detail }}
                    } @else {
                        {{ 'global.notifications.UNKNOWN_ERROR.message' | transloco }}
                    }
                </span>
            </div>
        </sgdf-callout>
        <sgdf-button variant="primary" size="large" (click)="retry()">
            <sgdf-icon slot="prefix" name="rotate-right" library="solid"/>
            {{ 'global.error.retry' | transloco }}
        </sgdf-button>
    </section>
</main>

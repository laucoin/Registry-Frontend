<app-list (updateRequired)='loadPage($event)'
          [elementPage]='facade.participantsPage()'
          [error]='facade.participantsPageError()'
          [loading]='facade.participantsPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='field'>
            <label for='text-search-field'>{{ 'participants.search-and-filter.text' | translate }}</label>
            <input id='text-search-field'
                   type='text'
                   fluid
                   pInputText
                   (keydown.enter)='loadPage(pageEvent)'
                   [formControl]='textSearched' />
        </div>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='status-search-field'>{{ 'participants.search-and-filter.status' | translate }}</label>
                <p-select inputId='status-search-field'
                          fluid
                          [options]='facade.presencesStatusMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent)'
                          [formControl]='statusSearched' />
            </div>
            <div class='field'>
                <label for='visibility-search-field'>{{ 'participants.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='visibility-search-field'
                          fluid
                          [options]='facade.visibilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent)'
                          [formControl]='visibilitySearched' />
            </div>
        </div>
        <div class='d-flex justify-content-center'>
            <p-button (onClick)='loadPage(pageEvent)'
                      [label]='"global.actions.search-and-filter" | translate'
                      outlined
                      rounded
                      icon='pi pi-search'
                      [loading]='facade.participantsPageLoading() || facade.participantsPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-participant>
        <app-participant-element [participant]='participant' />
    </ng-template>
    <ng-template appTemplate='creation'>
        @if (CurrentUserUtil.hasProjectAuthority(registryFacade.currentUser(), facade.selectedProjectId(), ProjectAuthority.REGISTRY_PROJECT_PARTICIPANT_C)) {
            <p-button class='m-1'
                      severity='success'
                      outlined
                      rounded
                      [label]='registryFacade.tinyScreen() ? "" : "global.actions.create" | translate'
                      icon='pi pi-plus'
                      [routerLink]='ParticipantRoutesEnum.CREATE' />
        }
    </ng-template>
</app-list>

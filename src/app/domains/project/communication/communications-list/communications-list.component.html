<app-list (updateRequired)='loadPage($event)'
          [elementPage]='facade.communicationsPage()'
          [error]='facade.communicationsPageError()'
          [loading]='facade.communicationsPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='start-date-time-search-field'>{{ 'communications.search-and-filter.start-datetime' | translate }}</label>
                <p-date-picker inputId='start-date-time-search-field'
                               fluid
                               showButtonBar
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               (onBlur)='loadPage(pageEvent)'
                               [formControl]='startDateTimeSearched' />
            </div>
            <div class='field'>
                <label for='end-date-time-search-field'>{{ 'communications.search-and-filter.end-datetime' | translate }}</label>
                <p-date-picker inputId='end-date-time-search-field'
                               fluid
                               showButtonBar
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               (onBlur)='loadPage(pageEvent)'
                               [formControl]='endDateTimeSearched' />
            </div>
        </div>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='text-search-field'>{{ 'communications.search-and-filter.text' | translate }}</label>
                <input id='text-search-field'
                       type='text'
                       fluid
                       pInputText
                       (keydown.enter)='loadPage(pageEvent)'
                       [formControl]='textSearched' />
            </div>
            <div class='field'>
                <label for='visibility-search-field'>{{ 'communications.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='visibility-search-field'
                          fluid
                          [options]='facade.visibilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent)'
                          [formControl]='visibilitySearched' />
            </div>
        </div>
        <div class='d-flex justify-content-center'>
            <p-button (onClick)='loadPage(pageEvent)'
                      [label]='"global.actions.search-and-filter" | translate'
                      outlined
                      rounded
                      icon='pi pi-search'
                      [loading]='facade.communicationsPageLoading() || facade.communicationsPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-communication>
        <app-communication-element [communication]='communication' />
    </ng-template>
    <ng-template appTemplate='creation'>
        @if (CurrentUserUtil.hasProjectAuthority(registryFacade.currentUser(), facade.selectedProjectId(),
                                                 ProjectAuthority.REGISTRY_PROJECT_COMMUNICATION_C)) {
            <p-button class='m-1'
                      severity='success'
                      outlined
                      rounded
                      [label]='registryFacade.tinyScreen() ? "" : "global.actions.create" | translate'
                      icon='pi pi-plus'
                      [routerLink]='CommunicationRoutesEnum.CREATE' />
        }
    </ng-template>
</app-list>

<app-element-card [element]='user()'
                  [actions]='actions()'
                  [actionMenuVisible]='actionMenuVisible()'
                  (action)='showDialogIfNeeded($event)'
                  icon='pi pi-user'>
    <div class='element-card'>
        <div class='user-info'>
            <div class='user-name d-flex'
                 [class.justify-content-center]='registryFacade.tinyScreen()'>
                <span class='pointer hover-underline'
                      tabindex='1'
                      (click)='copied()'
                      (keydown.enter)='copied()'
                      [cdkCopyToClipboard]='user().email'>
                    {{ (user().firstName | titlecase) + ' ' + (user().lastName | uppercase) }}
                </span>
            </div>
        </div>
        @if (GenericUtil.nonNull(user().birthday)) {
            <div class='birthday d-flex align-content-center' [class.justify-content-center]='registryFacade.tinyScreen()'>
                <i class='pi pi-gift'></i>
                <span class='ms-2'>{{ user().birthday | dateFormat: 'date' }}</span>
            </div>
        }
        @if (GenericUtil.nonNull(user().role)) {
            <div class='role d-flex' [class.justify-content-center]='registryFacade.tinyScreen()'>
                <app-severity-tag [value]='user().role!.label!' />
            </div>
        }
        @if (GenericUtil.nonNull(user().visible)) {
            <div class='status d-flex' [class.justify-content-center]='registryFacade.tinyScreen()'>
                <app-severity-tag
                        [severity]='user().visible ? SeverityEnum.SUCCESS : SeverityEnum.DANGER'
                        [value]='user() | visibilityName: "users" | translate' />
            </div>
        }
    </div>
</app-element-card>

<app-confirmation-dialog
        [loading]='facade.userLoading()'
        [element]='user()'
        [action]='action()'
        (hide)='action.set(undefined)'
        (handleAction)='handleAction($event)' />

<app-list (updateRequired)='loadPage($event)'
          [elementPage]='registryFacade.userProjectProfilesPage()'
          [error]='registryFacade.userProjectProfilesPageError()'
          [loading]='registryFacade.userProjectProfilesPageLoading()'
          emptyMessagePrefix='project-profiles.notifications.EMPTY'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='field'>
            <label for='profile-text-search-field'>{{ 'preferences.search-and-filter.text' | translate }}</label>
            <input id='profile-text-search-field'
                   type='text'
                   pInputText
                   (keydown.enter)='loadPage(pageEvent)'
                   [formControl]='textSearched' />
        </div>
        <div class='d-grid search-line'>
            <div class='field'>
                <label for='availability-search-field'>{{ 'project-profiles.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='availability-search-field'
                          fluid
                          [options]='facade.projectProfilesAvailabilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent)'
                          [formControl]='availabilitySearched' />
            </div>
            <div class='field'>
                <label for='profile-date-time-search-field'>{{ 'preferences.search-and-filter.datetime' | translate }}</label>
                <p-date-picker [formControl]='dateTimeSearched'
                               showButtonBar
                               [readonlyInput]='true'
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               inputId='profile-date-time-search-field'
                               selectionMode='range'
                               fluid />
            </div>
        </div>
        <div class='d-flex flex-wrap justify-content-center pt-2'>
            <p-button (onClick)='loadPage(pageEvent)'
                      [label]='"global.actions.search-and-filter" | translate'
                      outlined
                      rounded
                      icon='pi pi-search'
                      [loading]='registryFacade.userProjectProfilesPageLoading() || registryFacade.userProjectProfilesPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-profile>
        <app-project-profile-element [profile]='profile' view='user' />
    </ng-template>
    @if (!hasFilters()) {
        <ng-template appTemplate='empty'>
            <div class='p-4'>
                <div class='d-flex flex-column justify-content-center align-items-center'>
                    <h2>{{ 'project-profiles.notifications.EMPTY.message' | translate }}</h2>
                    <p>{{ 'project-profiles.empty' | translate }}</p>
                    <div class='d-flex justify-content-around'>
                        <p-button class='m-1'
                                  severity='success'
                                  outlined
                                  rounded
                                  [label]='"project-profiles.actions.create-project" | translate'
                                  icon='pi pi-plus'
                                  [routerLink]='"/" + AppRouteEnum.PROJECTS_CREATION' />
                        <p-button class='m-1'
                                  severity='info'
                                  outlined
                                  rounded
                                  [label]='"project-profiles.actions.invitations" | translate'
                                  icon='pi pi-envelope'
                                  [routerLink]='"/" + AppRouteEnum.USERS_INVITATIONS' />
                    </div>
                </div>
            </div>
        </ng-template>
    }
</app-list>

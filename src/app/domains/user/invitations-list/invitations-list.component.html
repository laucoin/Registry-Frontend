<app-list (updateRequired)='loadPage($event)'
          [elementPage]='registryFacade.userProjectProfileInvitationsPage()'
          [error]='registryFacade.userProjectProfileInvitationsPageError()'
          [loading]='registryFacade.userProjectProfileInvitationsPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='row'>
            <div class='col-12 col-sm-6 col-md-12 col-lg-6 search-field'>
                <label for='invitation-text-search-field'>{{ 'preferences.search-and-filter.text' | translate }}</label>
                <input id='invitation-text-search-field'
                       type='text'
                       pInputText
                       (keydown.enter)='loadPage(pageEvent)'
                       [formControl]='textSearched' />
            </div>
            <div class='col-12 col-sm-6 col-md-12 col-lg-6 search-field'>
                <label for='invitation-date-time-search-field'>{{ 'preferences.search-and-filter.datetime' | translate }}</label>
                <p-date-picker [formControl]='dateTimeSearched'
                               showButtonBar
                               [readonlyInput]='true'
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               inputId='invitation-date-time-search-field'
                               selectionMode='range'
                               fluid />
            </div>
        </div>
        <div class='d-flex flex-wrap justify-content-center pt-2'>
            <p-button (onClick)='loadPage(pageEvent)'
                      [label]='"global.actions.search-and-filter" | translate'
                      outlined
                      rounded
                      icon='pi pi-search'
                      [loading]='registryFacade.userProjectProfileInvitationsPageLoading() || registryFacade.userProjectProfileInvitationsPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-profile>
        <app-project-profile-element [profile]='profile' view='user' />
    </ng-template>
</app-list>

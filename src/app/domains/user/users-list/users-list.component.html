<app-list (updateRequired)='loadPage($event)'
          [elementPage]='facade.usersPage()'
          [error]='facade.usersPageError()'
          [loading]='facade.usersPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='d-grid search-line'>
            <div class='field'>
                <label for='text-search-field'>{{ 'users.search-and-filter.text' | translate }}</label>
                <input id='text-search-field'
                       type='text'
                       fluid
                       pInputText
                       (keydown.enter)='loadPage(pageEvent)'
                       [formControl]='textSearched' />
            </div>
            <div class='field'>
                <label for='visibility-search-field'>{{ 'users.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='visibility-search-field'
                          fluid
                          [options]='facade.statusMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent)'
                          [formControl]='visibilitySearched' />
            </div>
        </div>
        <div class='d-flex justify-content-center'>
            <p-button (onClick)='loadPage(pageEvent)'
                      [label]='"global.actions.search-and-filter" | translate'
                      outlined
                      rounded
                      icon='pi pi-search'
                      [loading]='facade.usersPageLoading() || facade.usersPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-user>
        <app-user-element [user]='user' />
    </ng-template>
</app-list>

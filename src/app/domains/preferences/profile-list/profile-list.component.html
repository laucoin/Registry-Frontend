<app-list (updateRequired)='loadPage($event)'
          [elementPage]='registryFacade.userEventProfilesPage()'
          [error]='registryFacade.userEventProfilesPageError()'
          [loading]='registryFacade.userEventProfilesPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='row'>
            <div class='col-12 col-sm-6 col-md-12 col-lg-6 search-field'>
                <label for='profiles-text-search-field'>{{ 'preferences.search-and-filter.text' | translate }}</label>
                <input pInputText id='profiles-text-search-field'
                       type='text'
                       (keydown.enter)='loadPage(pageEvent)'
                       [formControl]='textSearched' />
            </div>
            <div class='col-12 col-sm-6 col-md-12 col-lg-6 search-field'>
                <label for='profiles-date-time-search-field'>{{ 'preferences.search-and-filter.datetime' | translate }}</label>
                <p-date-picker [formControl]='dateTimeSearched'
                               showButtonBar
                               [readonlyInput]='true'
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               inputId='profiles-date-time-search-field'
                               selectionMode='range'
                               fluid />
            </div>
        </div>
        <div class='d-flex flex-wrap justify-content-center pt-2'>
            <p-button (onClick)='loadPage(pageEvent)'
                      [label]='"global.actions.search-and-filter" | translate'
                      outlined
                      rounded
                      icon='pi pi-search'
                      [loading]='registryFacade.userEventProfilesPageLoading() || registryFacade.userEventProfilesPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-profile>
        <app-event-profile-element [profile]='profile' view='user' />
    </ng-template>
    <ng-template appTemplate='empty'>
        <app-message [message]='message'>
            <div class='d-flex align-content-center justify-content-center'>
                <p-button
                        [routerLink]='"/" + AppRouteEnum.EVENTS_CREATION.toString()'
                        [label]='"preferences.actions.create-event" | translate'
                        rounded
                        icon='pi pi-plus'
                        severity='success' />
                <p-button
                        class='ms-2'
                        [routerLink]='"/" + AppRouteEnum.PREFERENCES_INVITATIONS.toString()'
                        [label]='"preferences.actions.invitation" | pluralTranslation: (registryFacade.userEventProfileInvitationsPage()?.content?.length ?? 0) | translate'
                        rounded
                        icon='pi pi-send'
                        severity='info' />
            </div>
        </app-message>
    </ng-template>
</app-list>

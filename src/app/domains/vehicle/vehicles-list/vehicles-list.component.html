<app-list (updateRequired)='loadPage($event, contextEventId())'
          [elementPage]='facade.vehiclesPage()'
          [error]='facade.vehiclesPageError()'
          [loading]='facade.vehiclesPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='text-search-field'>{{ 'vehicles.search-and-filter.text' | translate }}</label>
                <input id='text-search-field'
                       type='text'
                       fluid
                       pInputText
                       (keydown.enter)='loadPage(pageEvent, contextEventId())'
                       [formControl]='textSearched' />
            </div>
            <div class='field'>
                <label for='date-time-search-field'>{{ 'vehicles.search-and-filter.datetime' | translate }}</label>
                <p-date-picker inputId='date-time-search-field'
                               fluid
                               [showButtonBar]='true'
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               (onBlur)='loadPage(pageEvent, contextEventId())'
                               [formControl]='dateTimeSearched' />
            </div>
        </div>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='availability-search-field'>{{ 'vehicles.search-and-filter.availability' | translate }}</label>
                <p-select inputId='availability-search-field'
                          fluid
                          [options]='facade.presencesStatusMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent, contextEventId())'
                          [formControl]='statusSearched' />
            </div>
            <div class='field'>
                <label for='visibility-search-field'>{{ 'vehicles.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='visibility-search-field'
                          fluid
                          [options]='facade.visibilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent, contextEventId())'
                          [formControl]='visibilitySearched' />
            </div>
        </div>
        <div class='d-flex justify-content-center'>
            <p-button (click)='loadPage(pageEvent, contextEventId())'
                      [label]='"global.actions.search-and-filter" | translate'
                      [outlined]='true'
                      [rounded]='true'
                      icon='pi pi-search'
                      [loading]='facade.vehiclesPageLoading() || facade.vehiclesPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-vehicle>
        <app-vehicle-element [vehicle]='vehicle' />
    </ng-template>
    <ng-template appTemplate='creation'>
        @if (CurrentUserUtil.hasEventAuthority(registryFacade.currentUser(), contextEventId(), EventAuthority.REGISTRY_EVENT_VEHICLE_C)) {
            <p-button class='m-1'
                      severity='success'
                      [outlined]='true'
                      [rounded]='true'
                      [label]='registryFacade.tinyScreen() ? "" : "global.actions.create" | translate'
                      icon='pi pi-plus'
                      [routerLink]='VehicleRoutesEnum.CREATE' />
        }
    </ng-template>
</app-list>

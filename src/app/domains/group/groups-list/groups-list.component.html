<app-list (updateRequired)='loadPage($event, contextEventId())'
          [elementPage]='facade.groupsPage()'
          [error]='facade.groupsPageError()'
          [loading]='facade.groupsPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='text-search-field'>{{ 'groups.search-and-filter.text' | translate }}</label>
                <input id='text-search-field'
                       type='text'
                       fluid
                       pInputText
                       (keydown.enter)='loadPage(pageEvent, contextEventId())'
                       [formControl]='textSearched' />
            </div>
            <div class='field'>
                <label for='date-time-search-field'>{{ 'groups.search-and-filter.datetime' | translate }}</label>
                <p-date-picker inputId='date-time-search-field'
                               fluid
                               [showButtonBar]='true'
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               (onBlur)='loadPage(pageEvent, contextEventId())'
                               [formControl]='dateTimeSearched' />
            </div>
        </div>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='presence-search-field'>{{ 'groups.search-and-filter.presence' | translate }}</label>
                <p-select inputId='presence-search-field'
                          fluid
                          [options]='facade.availabilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent, contextEventId())'
                          [formControl]='presenceSearched' />
            </div>
            <div class='field'>
                <label for='visibility-search-field'>{{ 'groups.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='visibility-search-field'
                          fluid
                          [options]='facade.visibilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent, contextEventId())'
                          [formControl]='visibilitySearched' />
            </div>
        </div>
        <div class='d-flex justify-content-center'>
            <p-button (click)='loadPage(pageEvent, contextEventId())'
                      [label]='"global.actions.search-and-filter" | translate'
                      [outlined]='true'
                      [rounded]='true'
                      icon='pi pi-search'
                      [loading]='facade.groupsPageLoading() || facade.groupsPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='element' let-layout='layout' let-group>
        <app-group-element [group]='group' />
    </ng-template>
    <ng-template appTemplate='creation'>
        @if (CurrentUserUtil.hasEventAuthority(registryFacade.currentUser(), contextEventId(), EventAuthority.REGISTRY_EVENT_GROUP_C)) {
            <p-button class='m-1'
                      severity='success'
                      [outlined]='true'
                      [rounded]='true'
                      [label]='registryFacade.tinyScreen() ? "" : "global.actions.create" | translate'
                      icon='pi pi-plus'
                      [routerLink]='GroupRoutesEnum.CREATE' />
        }
    </ng-template>
</app-list>

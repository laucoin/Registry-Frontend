<app-list (updateRequired)='loadPage($event, contextEventId())'
          [elementPage]='facade.eventProfilesPage()'
          [error]='facade.eventProfilesPageError()'
          [loading]='facade.eventProfilesPageLoading()'>
    <ng-template appTemplate='search' [formGroup]='form' let-pageEvent>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='text-search-field'>{{ 'event-profiles.search-and-filter.text.user' | translate }}</label>
                <input id='text-search-field'
                       type='text'
                       fluid
                       pInputText
                       (keydown.enter)='loadPage(pageEvent, contextEventId())'
                       [formControl]='textSearched' />
            </div>
            <div class='field'>
                <label for='date-time-search-field'>{{ 'event-profiles.search-and-filter.datetime' | translate }}</label>
                <p-date-picker inputId='date-time-search-field'
                               fluid
                               [showButtonBar]='true'
                               [showTime]='true'
                               [touchUI]='registryFacade.tinyScreen()'
                               (onBlur)='loadPage(pageEvent, contextEventId())'
                               [formControl]='dateTimeSearched' />
            </div>
        </div>
        <div class='d-grid search-line g-2'>
            <div class='field'>
                <label for='status-search-field'>{{ 'event-profiles.search-and-filter.status' | translate }}</label>
                <p-select inputId='status-search-field'
                          fluid
                          [loading]='!facade.eventProfilesStatusMetadata()'
                          [options]='facade.eventProfilesStatusMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent, contextEventId())'
                          [formControl]='statusSearched' />
            </div>
            <div class='field'>
                <label for='availability-search-field'>{{ 'event-profiles.search-and-filter.visibility' | translate }}</label>
                <p-select inputId='availability-search-field'
                          fluid
                          [options]='facade.eventProfilesAvailabilitiesMetadata()'
                          optionLabel='label'
                          optionValue='value'
                          (onChange)='loadPage(pageEvent, contextEventId())'
                          [formControl]='availabilitySearched' />
            </div>
        </div>
        <div class='d-flex justify-content-center'>
            <p-button (click)='loadPage(pageEvent, contextEventId())'
                      [label]='"global.actions.search-and-filter" | translate'
                      [outlined]='true'
                      [rounded]='true'
                      icon='pi pi-search'
                      [loading]='facade.eventProfilesPageLoading() || facade.eventProfilesPageSilentLoading()' />
        </div>
    </ng-template>
    <ng-template appTemplate='creation'>
        @if (CurrentUserUtil.hasEventAuthority(registryFacade.currentUser(), contextEventId(), EventAuthority.REGISTRY_EVENT_PROFILE_C)) {
            <p-button class='m-1'
                      severity='success'
                      [outlined]='true'
                      [rounded]='true'
                      [label]='registryFacade.tinyScreen() ? "" : "event-profiles.actions.invite-user.few" | translate'
                      icon='pi pi-user-plus'
                      [routerLink]='EventProfileRoutesEnum.INVITE' />
        }
    </ng-template>
    <ng-template appTemplate='element' let-profile>
        <app-event-profile-element [profile]='profile' view='event' />
    </ng-template>
</app-list>

<app-form [form]='form' [loading]='(loading$ | async) ?? false'>
    <h2>{{ 'profile.form.title.create' | translate : { name: (contextEvent$ | async)?.name } }}</h2>
    <p-card>
        <form [formGroup]='form'>
            <div class='field'>
                <label for='role' appRequired>{{ 'profile.form.role' | translate }}</label>
                <p-select
                        inputId='role'
                        fluid
                        [options]='(assignableRoles$ | async) ?? []'
                        [formControl]='role'
                        [placeholder]='"profile.example.role" | translate: { role: ((assignableRoles$ | async) ?? []) ?
                        (assignableRoles$ | async)?.[0]?.label : "" }'
                        (keydown.enter)='submit()'
                        optionLabel='label'
                        optionValue='value' />
                <app-form-field-error [control]='role'
                                      translationPrefix='profile.form.error.role' />
            </div>
            <div class='field'>
                <label for='profiles-range'>{{ 'profile.form.date-range' | translate }}</label>
                <p-date-picker [formControl]='range'
                               [showButtonBar]='true'
                               [readonlyInput]='true'
                               [showTime]='true'
                               [touchUI]='isMobile()'
                               [placeholder]='"profile.example.presence" | translate: {
                                   begin: exampleBeginDate | date: ("datetime.format.date" | translate),
                                   end: exampleEndDate | date: ("datetime.format.date" | translate)
                               }'
                               (keydown.enter)='submit()'
                               id='profiles-range'
                               inputId='profiles-range'
                               selectionMode='range'
                               fluid />
                <small class='secondary-color'>{{ 'info.message.default-range' | translate }}</small>
                <app-form-field-error [control]='range'
                                      translationPrefix='profile.form.error.range' />
            </div>
            <p-divider />
            <div class='field'>
                <label for='users' appRequired>{{ 'profile.form.users' | translate }}</label>
                <app-select-elements-field [formControl]='users'
                                           [suggestions]='(usersSuggestion$ | async) ?? []'
                                           [searchLabel]='"profile.form.user-search" | translate'
                                           [emptyPlaceholder]='"profile.form.no-user" | translate'
                                           inputId='users'
                                           (handleSearch)='handleSearch($event.query)' />
                <app-form-field-error [control]='users'
                                      translationPrefix='profile.form.error.users' />
            </div>
        </form>
        <div class='d-flex pt-4 justify-content-center align-items-center'>
            <p-button
                    (click)='navigateToRedirectUri()'
                    [label]='"cancel" | translate'
                    [outlined]='true'
                    [rounded]='true' />
            <p-button
                    class='ms-2'
                    (click)='submit()'
                    [label]='("profile.form.create." + (users.value?.length > 1 ? "plural" : "singular")) | translate'
                    [rounded]='true'
                    icon='pi pi-user-plus'
                    severity='success' />
        </div>
    </p-card>
</app-form>

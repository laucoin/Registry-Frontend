<sgdf-table
	data-test-id="account-info-table"
	class="h-full [&::part(grid)]:h-full [&::part(grid)]:table-fixed"
	appearance="soft"
	[attr.aria-busy]="!currentUser()"
>
	<sgdf-table-row>
		<sgdf-table-cell header class="flex items-center gap-1">
			<sgdf-icon name="user" library="solid" />
			<h2 data-test-id="account-info-title">{{ 'myAccount.info.title' | transloco }}</h2>
		</sgdf-table-cell>
	</sgdf-table-row>

	<ng-container
		[ngTemplateOutlet]="row"
		[ngTemplateOutletContext]="{ $implicit: 'myAccount.info.name' | transloco, id: 'name', value: fullName() }"
	/>

	<ng-container
		[ngTemplateOutlet]="row"
		[ngTemplateOutletContext]="{
			$implicit: 'myAccount.info.email' | transloco,
			id: 'email',
			value: currentUser()?.email,
		}"
	/>

	<ng-container
		[ngTemplateOutlet]="row"
		[ngTemplateOutletContext]="{
			$implicit: 'myAccount.info.role' | transloco,
			id: 'role',
			value: currentUser()?.role?.label,
		}"
	/>

	<ng-container
		[ngTemplateOutlet]="row"
		[ngTemplateOutletContext]="{
			$implicit: 'myAccount.info.lastLogin' | transloco,
			id: 'last-login',
			date: currentUser()?.lastLogin,
		}"
	/>

	<sgdf-table-row class="h-full">
		<sgdf-table-cell data-test-id="account-info-hint" class="align-bottom text-sm opacity-80">
			{{ 'myAccount.info.hint' | transloco: { origin: organization } }}
		</sgdf-table-cell>
	</sgdf-table-row>
</sgdf-table>

<ng-template #row let-title let-id="id" let-value="value" let-date="date">
	<sgdf-table-row data-test-id="account-info-row" [attr.data-id]="id">
		<sgdf-table-cell row-header class="flex min-w-0 flex-col gap-0.5 sm:flex-row sm:justify-between sm:gap-4">
			<span data-test-id="account-info-row-label" class="shrink-0 uppercase opacity-80">{{ title }}</span>
			@if (!currentUser()) {
				<sgdf-skeleton data-test-id="account-info-row-skeleton" class="h-6 w-60" effect="pulse" shape="rounded" />
			} @else if (date) {
				<sgdf-relative-time data-test-id="account-info-row-date" [date]="date" sync />
			} @else if (value) {
				<span data-test-id="account-info-row-value" class="min-w-0 truncate sm:text-end" [attr.title]="value">{{
					value
				}}</span>
			} @else {
				<span data-test-id="account-info-row-empty" class="min-w-0 sm:text-end">{{
					'myAccount.info.empty' | transloco
				}}</span>
			}
		</sgdf-table-cell>
	</sgdf-table-row>
</ng-template>

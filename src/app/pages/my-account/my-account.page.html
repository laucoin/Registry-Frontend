<sgdf-page-title [eyebrow]="'myAccount.eyebrow' | transloco"
                 [lede]="'myAccount.subtitle' | transloco">
    {{ 'myAccount.title' | transloco }}
</sgdf-page-title>

<section class="grid grid-cols-1 gap-(--spacing--block) lg:grid-cols-12">
    <div class="lg:col-span-7 lg:row-span-2">
        <app-account-info class="block h-full"/>
    </div>
    <div class="lg:col-span-5">
        <app-account-language class="block h-full"/>
    </div>
    <div class="lg:col-span-5">
        <app-account-theme class="block h-full"/>
    </div>
    <div class="lg:col-span-12">
        <app-account-personal-data/>
    </div>
</section>

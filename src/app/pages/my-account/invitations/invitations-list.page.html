<sgdf-page-title
	[eyebrow]="'project-profiles.pages.invitations.eyebrow' | transloco"
	[lede]="'project-profiles.pages.invitations.subtitle' | transloco"
>
	{{ 'project-profiles.pages.invitations.title' | transloco }}
</sgdf-page-title>

<app-list
	data-test-id="invitations-list-list"
	class="mt-(--spacing--block) block"
	emptyMessagePrefix="project-profiles.notifications.EMPTY"
	[elementPage]="userProfileFacade.userProjectProfileInvitationsPage()"
	[error]="userProfileFacade.userProjectProfileInvitationsPageError()"
	[loading]="userProfileFacade.userProjectProfileInvitationsPageLoading()"
	[loadingMore]="userProfileFacade.userProjectProfileInvitationsPageSilentLoading()"
	[activeFilters]="activeFilters()"
	(updateRequired)="loadBatch($event)"
	(filtersReset)="resetFilters()"
>
	<ng-template appTemplate="search">
		<form
			data-test-id="invitations-list-search-form"
			class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
			(submit)="$event.preventDefault()"
		>
			<sgdf-input
				data-test-id="invitations-list-q-input"
				enterkeyhint="search"
				(keydown.enter)="searchQuery.submit()"
				(focusout)="searchQuery.submit()"
				appSgdfField
				[label]="'preferences.search-and-filter.text' | transloco"
				[formField]="form.q"
			/>
			<sgdf-date-time-picker
				data-test-id="invitations-list-at-picker"
				appSgdfField
				with-time
				[label]="'preferences.search-and-filter.datetime' | transloco"
				[formField]="form.at"
			/>
			<app-sort-fields [sortBy]="form.sortBy" [sortDirection]="form.sortDirection" [fields]="sortFields" />
		</form>
	</ng-template>

	<ng-template appTemplate="element" let-profile>
		<sgdf-list-item data-test-id="profile-row" [attr.data-id]="profile.id" appProjectProfileRow [profile]="profile" />
	</ng-template>

	<ng-template appTemplate="empty">
		<sgdf-callout
			data-test-id="invitations-list-empty-callout"
			variant="neutral"
			[title]="'project-profiles.notifications.EMPTY-INVITATION.message' | transloco"
		>
			<div class="flex flex-col items-start gap-(--spacing--in-block)">
				<span>{{ 'project-profiles.empty-invitation' | transloco }}</span>
				<span class="flex flex-wrap items-center gap-2">
					<sgdf-button
						data-test-id="invitations-list-create-project-button"
						size="small"
						variant="primary"
						[routerLink]="createRoute"
					>
						<sgdf-icon slot="prefix" name="plus" library="solid" />
						{{ 'project-profiles.actions.create-project' | transloco }}
					</sgdf-button>
					<sgdf-button
						data-test-id="invitations-list-projects-button"
						size="small"
						appearance="outlined"
						[routerLink]="projectsRoute"
					>
						<sgdf-icon slot="prefix" name="folder-open" library="solid" />
						{{ 'project-profiles.actions.projects' | transloco }}
					</sgdf-button>
				</span>
			</div>
		</sgdf-callout>
	</ng-template>
</app-list>

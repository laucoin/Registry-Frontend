<sgdf-page-title [eyebrow]="'home.eyebrow' | transloco" [lede]="'home.subtitle' | transloco">
    {{ 'home.greeting' | transloco: { name: firstName() } }}
    @if (canCreate()) {
        <sgdf-button data-testid="home-create-button" slot="actions" variant="primary" [routerLink]="createRoute">
            <sgdf-icon slot="prefix" name="plus" library="solid"/>
            {{ 'home.create' | transloco }}
        </sgdf-button>
    }
</sgdf-page-title>

<section class="grid grid-cols-1 gap-(--spacing--block) md:grid-cols-2 lg:grid-cols-12">
    <app-home-favorite-projects class="block min-w-0 md:col-span-2 lg:col-span-12"/>
    <app-home-invitations class="block min-w-0 md:col-span-2 lg:col-span-5"/>
    <app-home-attention-projects class="block min-w-0 lg:col-span-4"/>
    <app-home-quick-access class="block min-w-0 lg:col-span-3"/>
</section>

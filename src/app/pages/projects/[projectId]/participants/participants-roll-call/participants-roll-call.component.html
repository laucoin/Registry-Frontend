<div class="flex flex-col gap-(--spacing--in-block-small)">
	<div class="flex flex-wrap items-center justify-between gap-(--spacing--in-block)">
		<span data-test-id="participants-roll-call-count" role="status" class="font-semibold">
			{{
				'projectHome.participantsPage.checked'
					| pluralTranslation: checkedCount()
					| transloco: { count: checkedCount() }
			}}
		</span>
		<sgdf-button
			data-test-id="participants-roll-call-uncheck-all-button"
			size="small"
			appearance="outlined"
			[disabled]="checkedCount() === 0"
			(click)="uncheckedAll.emit()"
		>
			{{ 'projectHome.participantsPage.uncheckAll' | transloco }}
		</sgdf-button>
	</div>
	<small data-test-id="participants-roll-call-disclaimer" class="flex items-start gap-2 opacity-80">
		<sgdf-icon name="circle-info" library="solid" class="mt-0.5 shrink-0" aria-hidden="true" />
		{{ 'projectHome.participantsPage.disclaimer' | transloco }}
	</small>
</div>

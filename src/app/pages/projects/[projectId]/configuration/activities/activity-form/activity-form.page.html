<app-form [form]='form'
          [loading]='loading()'
          [error]='error()'
          [title]='"activities.form.title" | formTitle: activity() | transloco : { name: activity()?.name }'>
    <p-card>
        <div class='field'>
            <label for='name' appRequired>{{ 'activities.form.name' | transloco }}</label>
            <input [formField]='form.name'
                   [placeholder]='"activities.form.placeholder.name" | transloco'
                   (keydown.enter)='submit()'
                   id='name'
                   pInputText
                   type='text' />
            <app-field-error [field]='form.name' translationPrefix='activities.form.error.name' />
        </div>
        <div class='field'>
            <label for='description'>{{ 'activities.form.description' | transloco }}</label>
            <textarea rows='5'
                      pTextarea
                      fluid
                      id='description'
                      [formField]='form.description'
                      (keydown.enter)='submit()'
                      [placeholder]='"activities.form.placeholder.description" | transloco'></textarea>
            <app-field-error [field]='form.description' translationPrefix='activities.form.error.description' />
        </div>
        <div class='flex flex-wrap'>
            <div class='duration field basis-full'>
                <label for='duration'>{{ 'activities.form.duration' | transloco }}</label>
                <app-duration-field [formField]='form.duration'
                                    inputId='duration'
                                    [fluid]='true'
                                    [placeholder]='"activities.form.placeholder.duration" | transloco' />
            </div>
            <div class='allowed-participants field basis-full'>
                <label for='allowed-participants'>{{ 'activities.form.allowed-participants' | transloco }}</label>
                <app-number-range-field [formField]='form.allowedParticipants'
                                        [minPlaceholder]='"activities.form.placeholder.allowed-min-participants" | transloco'
                                        [maxPlaceholder]='"activities.form.placeholder.allowed-max-participants" | transloco'
                                        inputId='allowed-participants' />
                <app-field-error [field]='form.allowedParticipants' translationPrefix='activities.form.error.allowed-participants' />
            </div>
        </div>
        <div class='flex flex-wrap'>
            <div class='left-field field'>
                <label for='begin-date-time'>{{ 'activities.form.begin-datetime' | transloco }}</label>
                <app-date-time-field [formField]='form.beginDateTime'
                                     inputId='begin-date-time'
                                     [datePlaceholder]='"activities.form.placeholder.date" | transloco: {
                                                            date: startDateExample | dateFormat: "date"
                                                         }'
                                     [timePlaceholder]='"activities.form.placeholder.time" | transloco: {
                                                            date: startDateExample | dateFormat: "time"
                                                         }' />
                <small class='secondary-color'>{{ 'activities.form.hint.begin-date-time' | transloco }}</small>
                <app-field-error [field]='form.beginDateTime' translationPrefix='activities.form.error.begin-datetime' />
            </div>
            <div class='right-field field'>
                <label for='end-date-time'>{{ 'activities.form.end-datetime' | transloco }}</label>
                <app-date-time-field [formField]='form.endDateTime'
                                     inputId='end-date-time'
                                     [datePlaceholder]='"activities.form.placeholder.date" | transloco: {
                                                            date: endDateExample | dateFormat: "date"
                                                         }'
                                     [timePlaceholder]='"activities.form.placeholder.time" | transloco: {
                                                            date: endDateExample | dateFormat: "time"
                                                         }' />
                <small class='secondary-color'>{{ 'activities.form.hint.end-date-time' | transloco }}</small>
                <app-field-error [field]='form.endDateTime' translationPrefix='activities.form.error.end-datetime' />
            </div>
        </div>
        @if (form.beginDateTime().valid() && form.endDateTime().valid()) {
            <app-field-error [field]='form' translationPrefix='activities.form.error.date-range' />
        }
    </p-card>
    <div class='flex mt-2 justify-center'>
        <p-button
                (onClick)='navigateToRedirectUri()'
                [label]='"global.actions.cancel" | transloco'
                text
                rounded />
        <p-button
                class='ms-2'
                (onClick)='submit()'
                [label]='activity() | formButton | transloco'
                rounded
                outlined
                [icon]='activity() | formIcon'
                [disabled]='saving()'
                severity='success' />
    </div>
</app-form>

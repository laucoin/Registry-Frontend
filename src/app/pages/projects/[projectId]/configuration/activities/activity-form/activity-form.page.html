<app-form-dialog
	data-test-id="activity-form-dialog"
	[title]="'activities.form.title' | formTitle: element() | transloco: { name: element()?.name }"
	[submitLabel]="element() | formButton"
	[submitIcon]="element() ? 'pen-to-square' : 'plus'"
	[loading]="loading()"
	[saving]="saving()"
	[error]="error()"
	(submitted)="submit()"
	(closed)="navigateToRedirectUri()"
>
	<sgdf-input
		data-test-id="activity-form-name-input"
		appSgdfField
		required
		[label]="'activities.form.name' | transloco"
		[placeholder]="'activities.form.placeholder.name' | transloco"
		[formField]="form.name"
		[appFieldError]="form.name"
		translationPrefix="activities.form.error.name"
	/>
	<sgdf-textarea
		data-test-id="activity-form-description-textarea"
		appSgdfField
		rows="4"
		[label]="'activities.form.description' | transloco"
		[placeholder]="'activities.form.placeholder.description' | transloco"
		[formField]="form.description"
		[appFieldError]="form.description"
		translationPrefix="activities.form.error.description"
	/>
	<sgdf-duration-picker
		data-test-id="activity-form-duration-picker"
		appSgdfField
		units="hours minutes"
		[label]="'activities.form.duration' | transloco"
		[formField]="form.duration"
	/>
	<app-number-range-field
		data-test-id="activity-form-allowed-participants-field"
		[formField]="form.allowedParticipants"
		[appFieldError]="form.allowedParticipants"
		translationPrefix="activities.form.error.allowed-participants"
		inputId="allowed-participants"
		[label]="'activities.form.allowed-participants' | transloco"
		[minPlaceholder]="'activities.form.placeholder.allowed-min-participants' | transloco"
		[maxPlaceholder]="'activities.form.placeholder.allowed-max-participants' | transloco"
	/>
	<div class="grid gap-3">
		<sgdf-date-time-picker
			data-test-id="activity-form-begin-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'activities.form.begin-datetime' | transloco"
			[hint]="'activities.form.hint.begin-date-time' | transloco"
			[formField]="form.beginDateTime"
			[appFieldError]="form.beginDateTime"
			translationPrefix="activities.form.error.begin-datetime"
		/>
		<sgdf-date-time-picker
			data-test-id="activity-form-end-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'activities.form.end-datetime' | transloco"
			[hint]="'activities.form.hint.end-date-time' | transloco"
			[formField]="form.endDateTime"
			[appFieldError]="form.endDateTime"
			translationPrefix="activities.form.error.end-datetime"
		/>
	</div>
</app-form-dialog>

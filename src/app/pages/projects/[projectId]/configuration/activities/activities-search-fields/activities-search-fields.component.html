<form
	data-test-id="activities-search-fields-search-form"
	class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
	(submit)="$event.preventDefault()"
>
	<sgdf-input
		data-test-id="activities-search-fields-q-input"
		enterkeyhint="search"
		(keydown.enter)="searched.emit()"
		(focusout)="searched.emit()"
		appSgdfField
		[label]="'activities.search-and-filter.text' | transloco"
		[formField]="form().q"
	/>
	<sgdf-date-time-picker
		data-test-id="activities-search-fields-at-picker"
		appSgdfField
		with-time
		[label]="'activities.search-and-filter.datetime' | transloco"
		[formField]="form().at"
	/>
	<sgdf-select
		data-test-id="activities-search-fields-is-available-select"
		appSgdfField
		[label]="'activities.search-and-filter.availability' | transloco"
		[formField]="form().isAvailable"
	>
		@for (item of facade.availabilitiesMetadata(); track item.label) {
			<sgdf-option [value]="item.value | booleanChoice">{{ item.label }}</sgdf-option>
		}
	</sgdf-select>
	<sgdf-select
		*appIfProjectAuthority="hiddenAuthority"
		data-test-id="activities-search-fields-is-visible-select"
		appSgdfField
		[label]="'activities.search-and-filter.visibility' | transloco"
		[formField]="form().isVisible"
	>
		@for (item of facade.visibilitiesMetadata(); track item.label) {
			<sgdf-option [value]="item.value | booleanChoice">{{ item.label }}</sgdf-option>
		}
	</sgdf-select>
	<app-sort-fields [sortBy]="form().sortBy" [sortDirection]="form().sortDirection" [fields]="sortFields" />
</form>

<sgdf-page-title appProjectEyebrow
                 [lede]="'movements.history-page.subtitle' | transloco">
    @if (entity()) {
        {{ title() }}
    } @else {
        <sgdf-skeleton effect="pulse" shape="rounded" class="inline-block h-8 w-48"/>
    }
</sgdf-page-title>

<app-list class="mt-(--spacing--block) block"
          emptyMessagePrefix="movements.notifications.EMPTY"
          [elementPage]="facade.vehicleMovementsPage()"
          [error]="facade.vehicleMovementsPageError()"
          [loading]="facade.vehicleMovementsPageLoading()"
          [loadingMore]="facade.vehicleMovementsPageSilentLoading()"
          [activeFilters]="activeFilters()"
          (updateRequired)="loadBatch($event)"
          (filtersReset)="resetFilters()">
    <ng-template appTemplate="search">
        <form class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
              (submit)="$event.preventDefault(); search()">
            <sgdf-date-time-picker appSgdfField with-time
                                   [label]="'movements.search-and-filter.start-datetime' | transloco"
                                   [formField]="form.startDateTimeSearched"/>
            <sgdf-date-time-picker appSgdfField with-time
                                   [label]="'movements.search-and-filter.end-datetime' | transloco"
                                   [formField]="form.endDateTimeSearched"/>
            <sgdf-select appSgdfField [label]="'movements.search-and-filter.type' | transloco"
                         [formField]="form.typeSearched">
                @for (item of movementFacade.movementTypesMetadata(); track item.label) {
                    <sgdf-option [value]="item.value ?? ''">{{ item.label }}</sgdf-option>
                }
            </sgdf-select>
            <sgdf-select appSgdfField [label]="'movements.search-and-filter.visibility' | transloco"
                         [formField]="form.visibilitySearched">
                @for (item of movementFacade.visibilitiesMetadata(); track item.label) {
                    <sgdf-option [value]="item.value | booleanChoice">{{ item.label }}</sgdf-option>
                }
            </sgdf-select>
            <div class="flex justify-end md:col-span-2">
                <sgdf-button variant="primary" appearance="outlined" submit
                             [loading]="facade.vehicleMovementsPageLoading()">
                    <sgdf-icon slot="prefix" name="magnifying-glass" library="solid"/>
                    {{ 'global.actions.search' | transloco }}
                </sgdf-button>
            </div>
        </form>
    </ng-template>

    <ng-template appTemplate="element" let-movement>
        <sgdf-list-item appMovementElement [movement]="movement" [vehicleId]="entity()?.id"/>
    </ng-template>
</app-list>

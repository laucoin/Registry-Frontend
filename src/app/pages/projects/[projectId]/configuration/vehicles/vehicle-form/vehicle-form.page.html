<app-form [form]='form'
          [loading]='loading()'
          [error]='error()'
          [title]='"vehicles.form.title" | formTitle: vehicle() | transloco : {
              registration: vehicle()?.licensePlate,
              brand: vehicle()?.brand,
              model: vehicle()?.model,
          }'>
    <p-card>
        <div class='field'>
            <label for='license-plate' appRequired>{{ 'vehicles.form.license-plate' | transloco }}</label>
            <p-inputmask mask='aa-999-aa'
                         inputId='license-plate'
                         styleClass='w-100'
                         [formControl]='licensePlate'
                         [placeholder]='"vehicles.form.placeholder.license-plate" | transloco'
                         (keydown.enter)='submit()' />
            <app-form-field-error [errors]='licensePlate.errors'
                                  [invalid]='FormHelper.invalid(licensePlate)'
                                  translationPrefix='vehicles.form.error.license-plate' />
        </div>
        <div class='field'>
            <label for='brand' appRequired>{{ 'vehicles.form.brand' | transloco }}</label>
            <input [formControl]='brand'
                   [placeholder]='"vehicles.form.placeholder.brand" | transloco'
                   (keydown.enter)='submit()'
                   id='brand'
                   pInputText
                   type='text' />
            <app-form-field-error [errors]='brand.errors'
                                  [invalid]='FormHelper.invalid(brand)'
                                  translationPrefix='vehicles.form.error.brand' />
        </div>
        <div class='field'>
            <label for='model' appRequired>{{ 'vehicles.form.model' | transloco }}</label>
            <input [formControl]='model'
                   [placeholder]='"vehicles.form.placeholder.model" | transloco'
                   (keydown.enter)='submit()'
                   id='model'
                   pInputText
                   type='text' />
            <app-form-field-error [errors]='model.errors'
                                  [invalid]='FormHelper.invalid(model)'
                                  translationPrefix='vehicles.form.error.model' />
        </div>
        <div class='flex flex-wrap'>
            <div class='left-field field'>
                <label for='begin-date-time'>{{ 'vehicles.form.begin-datetime' | transloco }}</label>
                <app-date-time-field [formControl]='beginDateTime'
                                     [invalid]='FormHelper.invalid(beginDateTime)'
                                     inputId='begin-date-time'
                                     [datePlaceholder]='"vehicles.form.placeholder.date" | transloco: {
                                                            date: startDateExample | dateFormat: "date"
                                                         }'
                                     [timePlaceholder]='"vehicles.form.placeholder.time" | transloco: {
                                                            date: startDateExample | dateFormat: "time"
                                                         }' />
                <small class='secondary-color'>{{ 'vehicles.form.hint.begin-date-time' | transloco }}</small>
                <app-form-field-error [errors]='beginDateTime.errors'
                                      [invalid]='FormHelper.invalid(beginDateTime)'
                                      translationPrefix='vehicles.form.error.begin-datetime' />
            </div>
            <div class='right-field field'>
                <label for='end-date-time'>{{ 'vehicles.form.end-datetime' | transloco }}</label>
                <app-date-time-field [formControl]='endDateTime'
                                     [invalid]='FormHelper.invalid(endDateTime)'
                                     inputId='end-date-time'
                                     [datePlaceholder]='"vehicles.form.placeholder.date" | transloco: {
                                                            date: endDateExample | dateFormat: "date"
                                                         }'
                                     [timePlaceholder]='"vehicles.form.placeholder.time" | transloco: {
                                                            date: endDateExample | dateFormat: "time"
                                                         }' />
                <small class='secondary-color'>{{ 'vehicles.form.hint.end-date-time' | transloco }}</small>
                <app-form-field-error [errors]='endDateTime.errors'
                                      [invalid]='FormHelper.invalid(endDateTime)'
                                      translationPrefix='vehicles.form.error.end-datetime' />
            </div>
        </div>
        <app-form-field-error [errors]='form.errors'
                              [invalid]='FormHelper.invalid(form) && beginDateTime.valid && endDateTime.valid'
                              translationPrefix='vehicles.form.error.date-range' />
    </p-card>
    <div class='flex mt-2 justify-center'>
        <p-button
                (onClick)='navigateToRedirectUri()'
                [label]='"global.actions.cancel" | transloco'
                text
                rounded />
        <p-button
                class='ms-2'
                (onClick)='submit()'
                [label]='vehicle() | formButton | transloco'
                rounded
                outlined
                [disabled]='saving()'
                [icon]='vehicle() | formIcon'
                severity='success' />
    </div>
</app-form>

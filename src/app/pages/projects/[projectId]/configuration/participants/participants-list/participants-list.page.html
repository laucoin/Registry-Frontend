<sgdf-page-title [eyebrow]="'projectEyebrow.configuration' | transloco" [lede]="'participants.list.subtitle' | transloco">
    {{ 'participants.list.title' | transloco }}
    @if (canCreate()) {
        <sgdf-button data-testid="participants-list-create-button" slot="actions" variant="primary" [routerLink]="createRoute">
            <sgdf-icon slot="prefix" name="plus" library="solid"/>
            {{ 'global.actions.create' | transloco }}
        </sgdf-button>
    }
</sgdf-page-title>

<app-participant-row #row/>

<app-list data-testid="participants-list-list" class="mt-(--spacing--block) block"
          emptyMessagePrefix="participants.notifications.EMPTY"
          [elementPage]="facade.participantsPage()"
          [error]="facade.participantsPageError()"
          [loading]="facade.participantsPageLoading()"
          [loadingMore]="facade.participantsPageSilentLoading()"
          [activeFilters]="activeFilters()"
          (updateRequired)="loadBatch($event)"
          (filtersReset)="resetFilters()">
    <ng-template appTemplate="search">
        <form data-testid="participants-list-search-form" class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-3"
              (submit)="$event.preventDefault()">
            <sgdf-input data-testid="participants-list-q-input" enterkeyhint="search" (keydown.enter)="searchQuery.submit()" (focusout)="searchQuery.submit()" appSgdfField [label]="'participants.search-and-filter.text' | transloco"
                        [formField]="form.q"/>
            <sgdf-select data-testid="participants-list-status-select" appSgdfField [label]="'participants.search-and-filter.status' | transloco"
                         [formField]="form.status">
                @for (item of facade.presencesStatusMetadata(); track item.label) {
                    <sgdf-option [value]="item.value ?? ''">{{ item.label }}</sgdf-option>
                }
            </sgdf-select>
            <sgdf-select *appIfProjectAuthority="hiddenAuthority" data-testid="participants-list-is-visible-select" appSgdfField [label]="'participants.search-and-filter.visibility' | transloco"
                         [formField]="form.isVisible">
                @for (item of facade.visibilitiesMetadata(); track item.label) {
                    <sgdf-option [value]="item.value | booleanChoice">{{ item.label }}</sgdf-option>
                }
            </sgdf-select>
            <app-sort-fields [sortBy]="form.sortBy" [sortDirection]="form.sortDirection" [fields]="sortFields"/>
        </form>
    </ng-template>

    <ng-template appTemplate="element" let-participant>
        <ng-container [ngTemplateOutlet]="row.template()" [ngTemplateOutletContext]="{ $implicit: participant }"/>
    </ng-template>
</app-list>

<form
	data-test-id="participants-search-fields-search-form"
	class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
	(submit)="$event.preventDefault()"
>
	<sgdf-input
		data-test-id="participants-search-fields-q-input"
		enterkeyhint="search"
		(keydown.enter)="searched.emit()"
		(focusout)="searched.emit()"
		appSgdfField
		[label]="'participants.search-and-filter.text' | transloco"
		[formField]="form().q"
	/>
	<sgdf-select
		data-test-id="participants-search-fields-status-select"
		appSgdfField
		[label]="'participants.search-and-filter.status' | transloco"
		[formField]="form().status"
	>
		@for (item of facade.presencesStatusMetadata(); track item.label) {
			<sgdf-option [value]="item.value ?? ''">{{ item.label }}</sgdf-option>
		}
	</sgdf-select>
	@if (hiddenAuthority(); as authority) {
		<sgdf-select
			*appIfProjectAuthority="authority"
			data-test-id="participants-search-fields-is-visible-select"
			appSgdfField
			[label]="'participants.search-and-filter.visibility' | transloco"
			[formField]="form().isVisible"
		>
			@for (item of facade.visibilitiesMetadata(); track item.label) {
				<sgdf-option [value]="item.value | booleanChoice">{{ item.label }}</sgdf-option>
			}
		</sgdf-select>
	}
	<app-sort-fields [sortBy]="form().sortBy" [sortDirection]="form().sortDirection" [fields]="sortFields()" />
</form>

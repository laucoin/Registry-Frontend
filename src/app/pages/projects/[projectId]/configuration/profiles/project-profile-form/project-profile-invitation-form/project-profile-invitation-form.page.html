<app-form [form]="form" [loading]="loading()" [error]="error()"
          [title]="'project-profiles.form.title.create' | transloco : { name: sessionFacade.selectedProject()?.name }">
    <form (submit)="$event.preventDefault(); submit()">
        <sgdf-card>
            <div class="flex flex-col gap-[0.75rem]">
                <sgdf-select appSgdfField required
                             [label]="'project-profiles.form.role' | transloco"
                             [loading]="!facade.projectProfileAssignableRolesMetadata()"
                             [placeholder]="'project-profiles.form.placeholder.role' | transloco: {
                                 role: facade.projectProfileAssignableRolesMetadata().length > 0
                                     ? facade.projectProfileAssignableRolesMetadata()[0].label
                                     : ''
                             }"
                             [formField]="form.role"
                             [appFieldError]="form.role" translationPrefix="project-profiles.form.error.role">
                    @for (role of facade.projectProfileAssignableRolesMetadata(); track role.value) {
                        <sgdf-option [value]="role.value">{{ role.label }}</sgdf-option>
                    }
                </sgdf-select>
                <div class="grid gap-[0.75rem] md:grid-cols-2">
                    <sgdf-date-time-picker appSgdfField with-time value-format="separate"
                                           [label]="'project-profiles.form.begin-datetime' | transloco"
                                           [hint]="'project-profiles.form.hint.begin-date-time' | transloco"
                                           [formField]="form.beginDateTime"
                                           [appFieldError]="form.beginDateTime" translationPrefix="project-profiles.form.error.begin-datetime"/>
                    <sgdf-date-time-picker appSgdfField with-time value-format="separate"
                                           [label]="'project-profiles.form.end-datetime' | transloco"
                                           [hint]="'project-profiles.form.hint.end-date-time' | transloco"
                                           [formField]="form.endDateTime"
                                           [appFieldError]="form.endDateTime" translationPrefix="project-profiles.form.error.end-datetime"/>
                </div>
                @if (form.beginDateTime().valid() && form.endDateTime().valid()) {
                    <app-field-error [field]="form" translationPrefix="project-profiles.form.error.date-range"/>
                }
                <sgdf-divider/>
                <div>
                    <h3 class="m-0 text-base font-semibold">{{ 'project-profiles.form.users' | pluralTranslation: model().users | transloco }}</h3>
                    <app-select-elements-field [formField]="form.users"
                                               [label]="'project-profiles.form.users.search' | transloco"
                                               [selectionLabel]="'project-profiles.form.users.selected' | pluralTranslation: model().users.length | transloco"
                                               [emptyMessage]="'project-profiles.form.users.empty' | transloco"
                                               [emptySelectionMessage]="'project-profiles.form.users.empty-search' | transloco"
                                               [suggestions]="facade.searchedUsersMetadata()"
                                               [selectItemBuilder]="UserHelper.toSelectItem"
                                               (handleSearch)="handleSearch($event.query)"/>
                    <app-field-error [field]="form.users" translationPrefix="project-profiles.form.error.users"/>
                </div>
            </div>
        </sgdf-card>
        <app-form-actions [submitLabel]="'project-profiles.actions.invite-user' | pluralTranslation: model().users.length"
                          submitIcon="user-plus"
                          [saving]="saving()"
                          (cancelled)="navigateToRedirectUri()"/>
    </form>
</app-form>

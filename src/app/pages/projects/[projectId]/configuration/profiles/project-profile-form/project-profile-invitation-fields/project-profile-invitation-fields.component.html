<div class="flex flex-col gap-[0.75rem]">
    <sgdf-select data-testid="project-profile-invitation-fields-role-select" appSgdfField required
                 [label]="'project-profiles.form.role' | transloco"
                 [loading]="!facade.projectProfileAssignableRolesMetadata()"
                 [placeholder]="'project-profiles.form.placeholder.role' | transloco: {
                     role: facade.projectProfileAssignableRolesMetadata().length > 0
                         ? facade.projectProfileAssignableRolesMetadata()[0].label
                         : ''
                 }"
                 [formField]="fields().role"
                 [appFieldError]="fields().role" translationPrefix="project-profiles.form.error.role">
        @for (role of facade.projectProfileAssignableRolesMetadata(); track role.value) {
            <sgdf-option [value]="role.value">{{ role.label }}</sgdf-option>
        }
    </sgdf-select>
    <div class="grid gap-[0.75rem] md:grid-cols-2">
        <sgdf-date-time-picker data-testid="project-profile-invitation-fields-begin-date-time-picker" appSgdfField with-time value-format="separate"
                               [label]="'project-profiles.form.begin-datetime' | transloco"
                               [hint]="'project-profiles.form.hint.begin-date-time' | transloco"
                               [formField]="fields().beginDateTime"
                               [appFieldError]="fields().beginDateTime" translationPrefix="project-profiles.form.error.begin-datetime"/>
        <sgdf-date-time-picker data-testid="project-profile-invitation-fields-end-date-time-picker" appSgdfField with-time value-format="separate"
                               [label]="'project-profiles.form.end-datetime' | transloco"
                               [hint]="'project-profiles.form.hint.end-date-time' | transloco"
                               [formField]="fields().endDateTime"
                               [appFieldError]="fields().endDateTime" translationPrefix="project-profiles.form.error.end-datetime"/>
    </div>
    <sgdf-divider/>
    <div>
        <h2 class="section-title">{{ 'project-profiles.form.users' | pluralTranslation: fields().users().value() | transloco }}</h2>
        <app-select-elements-field data-testid="project-profile-invitation-fields-users-field" [formField]="fields().users" [appFieldError]="fields().users" translationPrefix="project-profiles.form.error.users"
                                   [label]="'project-profiles.form.users.search' | transloco"
                                   [selectionLabel]="'project-profiles.form.users.selected' | pluralTranslation: fields().users().value().length | transloco"
                                   [emptyMessage]="'project-profiles.form.users.empty' | transloco"
                                   [emptySelectionMessage]="'project-profiles.form.users.empty-search' | transloco"
                                   [suggestions]="facade.searchedUsersMetadata()"
                                   [selectItemBuilder]="UserHelper.toSelectItem"
                                   (handleSearch)="handleSearch($event)"/>
    </div>
</div>

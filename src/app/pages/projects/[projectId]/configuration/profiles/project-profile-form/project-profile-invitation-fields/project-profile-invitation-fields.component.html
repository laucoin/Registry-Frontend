<div class="flex flex-col gap-3">
	<sgdf-select
		data-test-id="project-profile-invitation-fields-role-select"
		appSgdfField
		required
		[label]="'project-profiles.form.role' | transloco"
		[loading]="facade.projectProfileAssignableRolesLoading()"
		[placeholder]="
			'project-profiles.form.placeholder.role'
				| transloco
					: {
							role: facade.projectProfileAssignableRolesMetadata()[0]?.label ?? '',
					  }
		"
		[formField]="fields().role"
		[appFieldError]="fields().role"
		translationPrefix="project-profiles.form.error.role"
	>
		@for (role of facade.projectProfileAssignableRolesMetadata(); track role.value) {
			<sgdf-option [value]="role.value">{{ role.label }}</sgdf-option>
		}
	</sgdf-select>
	<div class="grid gap-3 md:grid-cols-2">
		<sgdf-date-time-picker
			data-test-id="project-profile-invitation-fields-begin-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'project-profiles.form.begin-datetime' | transloco"
			[hint]="'project-profiles.form.hint.begin-date-time' | transloco"
			[formField]="fields().beginDateTime"
			[appFieldError]="fields().beginDateTime"
			translationPrefix="project-profiles.form.error.begin-datetime"
		/>
		<sgdf-date-time-picker
			data-test-id="project-profile-invitation-fields-end-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'project-profiles.form.end-datetime' | transloco"
			[hint]="'project-profiles.form.hint.end-date-time' | transloco"
			[formField]="fields().endDateTime"
			[appFieldError]="fields().endDateTime"
			translationPrefix="project-profiles.form.error.end-datetime"
		/>
	</div>
	<sgdf-divider />
	<div>
		<h2 data-test-id="project-profile-invitation-fields-users-title" class="section-title">
			{{ 'project-profiles.form.users' | pluralTranslation: fields().users().value() | transloco }}
		</h2>
		<app-select-elements-field
			data-test-id="project-profile-invitation-fields-users-field"
			[formField]="fields().users"
			[appFieldError]="fields().users"
			translationPrefix="project-profiles.form.error.users"
			[label]="'project-profiles.form.users.search' | transloco"
			[hint]="'project-profiles.form.users.hint' | transloco"
			[selectionLabel]="
				'project-profiles.form.users.selected' | pluralTranslation: fields().users().value().length | transloco
			"
			[emptyMessage]="
				(facade.inviteByEmailEnabled()
					? 'project-profiles.form.users.empty-invite'
					: 'project-profiles.form.users.empty-search'
				) | transloco
			"
			[emptySelectionMessage]="'project-profiles.form.users.empty' | transloco"
			[suggestions]="suggestions()"
			[selectItemBuilder]="UserHelper.toSelectItem"
			(handleSearch)="handleSearch($event)"
		/>
	</div>
</div>

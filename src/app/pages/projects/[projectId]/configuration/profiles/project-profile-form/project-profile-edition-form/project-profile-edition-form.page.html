<app-form-dialog
	data-test-id="project-profile-edition-form-edit-dialog"
	[title]="
		'project-profiles.form.title.edit'
			| transloco
				: {
						firstName: projectProfile()?.user?.firstName,
						lastName: projectProfile()?.user?.lastName,
				  }
	"
	submitLabel="global.actions.edit"
	[loading]="loading()"
	[saving]="saving()"
	[error]="error()"
	(submitted)="submit()"
	(closed)="navigateToRedirectUri()"
>
	@if (projectProfile()?.user; as user) {
		<app-user-element [user]="user" />
	}
	<sgdf-select
		data-test-id="project-profile-edition-form-role-select"
		appSgdfField
		required
		[label]="'project-profiles.form.role' | transloco"
		[loading]="facade.projectProfileAssignableRolesLoading()"
		[hint]="'project-profiles.form.hint.role' | transloco"
		[formField]="form.role"
		[appFieldError]="form.role"
		translationPrefix="project-profiles.form.error.role"
	>
		@for (role of facade.projectProfileAssignableRolesMetadata(); track role.value) {
			<sgdf-option [value]="role.value">{{ role.label }}</sgdf-option>
		}
	</sgdf-select>
	<div class="grid gap-3">
		<sgdf-date-time-picker
			data-test-id="project-profile-edition-form-begin-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'project-profiles.form.begin-datetime' | transloco"
			[hint]="'project-profiles.form.hint.begin-date-time' | transloco"
			[formField]="form.beginDateTime"
			[appFieldError]="form.beginDateTime"
			translationPrefix="project-profiles.form.error.begin-datetime"
		/>
		<sgdf-date-time-picker
			data-test-id="project-profile-edition-form-end-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'project-profiles.form.end-datetime' | transloco"
			[hint]="'project-profiles.form.hint.end-date-time' | transloco"
			[formField]="form.endDateTime"
			[appFieldError]="form.endDateTime"
			translationPrefix="project-profiles.form.error.end-datetime"
		/>
	</div>
</app-form-dialog>

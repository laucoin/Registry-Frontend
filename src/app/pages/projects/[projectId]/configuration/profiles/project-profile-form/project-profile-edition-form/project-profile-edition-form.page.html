<app-form-dialog data-testid="project-profile-edition-form-edit-dialog" [title]="'project-profiles.form.title.edit' | transloco: {
                     firstName: projectProfile()?.user?.firstName,
                     lastName: projectProfile()?.user?.lastName,
                 }"
                 submitLabel="global.actions.edit"
                 [loading]="loading()"
                 [saving]="saving()"
                 [error]="error()"
                 (submitted)="submit()"
                 (closed)="navigateToRedirectUri()">
    @if (projectProfile()) {
        <app-user-element [user]="projectProfile()!.user!" [actionMenuVisible]="false"/>
    }
    <sgdf-select data-testid="project-profile-edition-form-role-select" appSgdfField required
                 [label]="'project-profiles.form.role' | transloco"
                 [hint]="'project-profiles.form.hint.role' | transloco"
                 [formField]="form.role"
                 [appFieldError]="form.role" translationPrefix="project-profiles.form.error.role">
        @for (role of facade.projectProfileAssignableRolesMetadata(); track role.value) {
            <sgdf-option [value]="role.value">{{ role.label }}</sgdf-option>
        }
    </sgdf-select>
    <div class="grid gap-[0.75rem] md:grid-cols-2">
        <sgdf-date-time-picker data-testid="project-profile-edition-form-begin-date-time-picker" appSgdfField with-time value-format="separate"
                               [label]="'project-profiles.form.begin-datetime' | transloco"
                               [hint]="'project-profiles.form.hint.begin-date-time' | transloco"
                               [formField]="form.beginDateTime"
                               [appFieldError]="form.beginDateTime" translationPrefix="project-profiles.form.error.begin-datetime"/>
        <sgdf-date-time-picker data-testid="project-profile-edition-form-end-date-time-picker" appSgdfField with-time value-format="separate"
                               [label]="'project-profiles.form.end-datetime' | transloco"
                               [hint]="'project-profiles.form.hint.end-date-time' | transloco"
                               [formField]="form.endDateTime"
                               [appFieldError]="form.endDateTime" translationPrefix="project-profiles.form.error.end-datetime"/>
    </div>
    @if (form.beginDateTime().valid() && form.endDateTime().valid()) {
        <app-field-error data-testid="project-profile-edition-form-date-range-error" [field]="form" translationPrefix="project-profiles.form.error.date-range"/>
    }
</app-form-dialog>

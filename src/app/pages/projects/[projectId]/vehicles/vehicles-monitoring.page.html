<sgdf-page-title
	data-test-id="vehicles-monitoring-title"
	[eyebrow]="'projectEyebrow.dashboard' | transloco"
	[lede]="'projectHome.vehiclesPage.subtitle' | transloco"
>
	{{ 'projectHome.vehiclesPage.title' | transloco }}
</sgdf-page-title>

<div class="mt-(--spacing--block) flex flex-col gap-(--spacing--block)">
	<app-project-vehicle-overview class="hidden md:block" [showLink]="false" />

	<app-list
		data-test-id="vehicles-monitoring-list"
		emptyMessagePrefix="vehicles.notifications.EMPTY"
		[label]="'projectHome.vehiclesPage.title' | transloco"
		[elementPage]="facade.vehiclesPage()"
		[error]="facade.vehiclesPageError()"
		[loading]="facade.vehiclesPageLoading()"
		[loadingMore]="facade.vehiclesPageSilentLoading()"
		[activeFilters]="activeFilters()"
		(updateRequired)="loadBatch($event)"
		(filtersReset)="resetFilters()"
	>
		<ng-template appTemplate="search">
			<form
				data-test-id="vehicles-monitoring-search-form"
				class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
				(submit)="$event.preventDefault()"
			>
				<sgdf-input
					data-test-id="vehicles-monitoring-q-input"
					enterkeyhint="search"
					(keydown.enter)="searchQuery.submit()"
					(focusout)="searchQuery.submit()"
					appSgdfField
					[label]="'vehicles.search-and-filter.text' | transloco"
					[formField]="form.q"
				/>
				<sgdf-select
					data-test-id="vehicles-monitoring-status-select"
					appSgdfField
					[label]="'vehicles.search-and-filter.availability' | transloco"
					[formField]="form.status"
				>
					@for (item of facade.presencesStatusMetadata(); track item.label) {
						<sgdf-option [value]="item.value ?? ''">{{ item.label }}</sgdf-option>
					}
				</sgdf-select>
				<app-sort-fields [sortBy]="form.sortBy" [sortDirection]="form.sortDirection" [fields]="sortFields" />
			</form>
		</ng-template>

		<ng-template appTemplate="element" let-vehicle>
			<sgdf-list-item data-test-id="vehicle-row" [attr.data-id]="vehicle.id" appMonitoringRow [row]="rowOf(vehicle)" />
		</ng-template>
	</app-list>
</div>

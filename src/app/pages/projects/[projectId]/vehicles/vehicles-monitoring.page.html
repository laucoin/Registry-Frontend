<sgdf-page-title [eyebrow]="'projectEyebrow.dashboard' | transloco" [lede]="'projectHome.vehiclesPage.subtitle' | transloco">
    {{ 'projectHome.vehiclesPage.title' | transloco }}
</sgdf-page-title>

<div class="mt-(--spacing--block) flex flex-col gap-(--spacing--block)">
    <app-project-vehicle-overview class="hidden md:block" [showLink]="false"/>

    <app-list data-testid="vehicles-monitoring-list" emptyMessagePrefix="vehicles.notifications.EMPTY"
              [label]="'projectHome.vehiclesPage.title' | transloco"
              [elementPage]="facade.vehiclesPage()"
              [error]="facade.vehiclesPageError()"
              [loading]="facade.vehiclesPageLoading()"
              [loadingMore]="facade.vehiclesPageSilentLoading()"
              [activeFilters]="activeFilters()"
              (updateRequired)="loadBatch($event)"
              (filtersReset)="resetFilters()">
        <ng-template appTemplate="search">
            <form data-testid="vehicles-monitoring-search-form" class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
                  (submit)="$event.preventDefault(); search()">
                <sgdf-input data-testid="vehicles-monitoring-q-input" appSgdfField [label]="'vehicles.search-and-filter.text' | transloco"
                            [formField]="form.q"/>
                <sgdf-select data-testid="vehicles-monitoring-status-select" appSgdfField [label]="'vehicles.search-and-filter.availability' | transloco"
                             [formField]="form.status">
                    @for (item of facade.presencesStatusMetadata(); track item.label) {
                        <sgdf-option [value]="item.value ?? ''">{{ item.label }}</sgdf-option>
                    }
                </sgdf-select>
                <div class="flex justify-end md:col-span-2">
                    <sgdf-button data-testid="vehicles-monitoring-search-submit" variant="primary" appearance="outlined" submit
                                 [loading]="facade.vehiclesPageLoading()">
                        <sgdf-icon slot="prefix" name="magnifying-glass" library="solid"/>
                        {{ 'global.actions.search' | transloco }}
                    </sgdf-button>
                </div>
            </form>
        </ng-template>

        <ng-template appTemplate="element" let-vehicle>
            <sgdf-list-item data-testid="vehicle-row" [attr.data-id]="vehicle.id" appMonitoringRow [row]="rowOf(vehicle)"/>
        </ng-template>
    </app-list>
</div>

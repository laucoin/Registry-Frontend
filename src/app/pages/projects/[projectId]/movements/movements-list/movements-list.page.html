<sgdf-page-title
	data-test-id="movements-list-title"
	[eyebrow]="'projectEyebrow.monitoring' | transloco"
	[lede]="'movements.list.subtitle' | transloco"
>
	{{ 'movements.list.title' | transloco }}
	<ng-container *appIfProjectAuthority="createAuthority">
		<sgdf-button
			data-test-id="movements-list-registered-button"
			slot="actions"
			variant="primary"
			[routerLink]="createRegisteredRoute"
		>
			<sgdf-icon slot="prefix" name="plus" library="solid" />
			{{ 'movements.list.create.registered' | transloco }}
		</sgdf-button>
		<sgdf-button
			data-test-id="movements-list-guest-button"
			slot="actions"
			variant="neutral"
			appearance="outlined"
			[routerLink]="createGuestRoute"
		>
			<sgdf-icon slot="prefix" name="plus" library="solid" />
			{{ 'movements.list.create.guest' | transloco }}
		</sgdf-button>
	</ng-container>
</sgdf-page-title>

<app-list
	data-test-id="movements-list-list"
	class="mt-(--spacing--block) block"
	emptyMessagePrefix="movements.notifications.EMPTY"
	[elementPage]="facade.movementsPage()"
	[error]="facade.movementsPageError()"
	[loading]="facade.movementsPageLoading()"
	[loadingMore]="facade.movementsPageSilentLoading()"
	[activeFilters]="activeFilters()"
	(updateRequired)="loadBatch($event)"
	(filtersReset)="resetFilters()"
>
	<ng-template appTemplate="search">
		<app-movements-search-fields [form]="form" />
	</ng-template>

	<ng-template appTemplate="element" let-movement>
		<sgdf-list-item data-test-id="movement-row" [attr.data-id]="movement.id" appMovementElement [movement]="movement" />
	</ng-template>
</app-list>

<form
	data-test-id="alerts-search-fields-search-form"
	class="grid grid-cols-1 items-end gap-(--spacing--in-block-large) md:grid-cols-2"
	(submit)="$event.preventDefault()"
>
	<sgdf-input
		data-test-id="alerts-search-fields-q-input"
		enterkeyhint="search"
		(keydown.enter)="searched.emit()"
		(focusout)="searched.emit()"
		appSgdfField
		class="md:col-span-2"
		[label]="'alerts.search-and-filter.text' | transloco"
		[formField]="form().q"
	/>
	<sgdf-select
		data-test-id="alerts-search-fields-status-select"
		appSgdfField
		[label]="'alerts.search-and-filter.status' | transloco"
		[formField]="form().status"
	>
		@for (item of facade.alertStatusMetadata(); track item.label) {
			<sgdf-option [value]="item.value ?? ''">{{ item.label }}</sgdf-option>
		}
	</sgdf-select>
	<sgdf-select
		*appIfProjectAuthority="hiddenAuthority"
		data-test-id="alerts-search-fields-is-visible-select"
		appSgdfField
		[label]="'alerts.search-and-filter.visibility' | transloco"
		[formField]="form().isVisible"
	>
		@for (item of facade.visibilitiesMetadata(); track item.label) {
			<sgdf-option [value]="item.value | booleanChoice">{{ item.label }}</sgdf-option>
		}
	</sgdf-select>
	<sgdf-date-time-picker
		data-test-id="alerts-search-fields-from-picker"
		appSgdfField
		with-time
		[label]="'alerts.search-and-filter.start-datetime' | transloco"
		[formField]="form().from"
	/>
	<sgdf-date-time-picker
		data-test-id="alerts-search-fields-to-picker"
		appSgdfField
		with-time
		[label]="'alerts.search-and-filter.end-datetime' | transloco"
		[formField]="form().to"
	/>
	<app-sort-fields [sortBy]="form().sortBy" [sortDirection]="form().sortDirection" [fields]="sortFields" />
</form>

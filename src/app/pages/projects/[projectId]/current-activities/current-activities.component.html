<app-list emptyMessagePrefix="activities.notifications.EMPTY"
          [elementPage]="facade.currentMovementsPageWithActivity()"
          [error]="facade.currentMovementsPageWithActivityError()"
          [loading]="facade.currentMovementsPageWithActivityLoading()"
          [loadingMore]="facade.currentMovementsPageWithActivitySilentLoading()"
          (updateRequired)="loadBatch($event)">
    <ng-template appTemplate="element" let-movement>
        <sgdf-list-item appMovementElement [movement]="movement" [reversible]="true" [communicable]="true"/>
    </ng-template>
</app-list>

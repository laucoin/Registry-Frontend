<app-list emptyMessagePrefix="movements.notifications.EMPTY"
          [elementPage]="facade.currentMovementsPageWithoutActivity()"
          [error]="facade.currentMovementsPageWithoutActivityError()"
          [loading]="facade.currentMovementsPageWithoutActivityLoading()"
          [loadingMore]="facade.currentMovementsPageWithoutActivitySilentLoading()"
          (updateRequired)="loadBatch($event)">
    <ng-template appTemplate="element" let-movement>
        <sgdf-list-item appMovementElement [movement]="movement" [reversible]="true"/>
    </ng-template>
</app-list>

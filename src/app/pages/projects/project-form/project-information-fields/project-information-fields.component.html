<div class="flex flex-col gap-3">
	<sgdf-input
		data-test-id="project-information-fields-name-input"
		appSgdfField
		required
		[label]="'projects.form.name' | transloco"
		[placeholder]="'projects.form.placeholder.name' | transloco"
		[formField]="form().name"
		[appFieldError]="form().name"
		translationPrefix="projects.form.error.name"
	/>
	<div class="grid gap-3 md:grid-cols-2">
		<sgdf-date-time-picker
			data-test-id="project-information-fields-begin-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'projects.form.begin-datetime' | transloco"
			[formField]="form().beginDateTime"
			[appFieldError]="form().beginDateTime"
			translationPrefix="projects.form.error.begin-datetime"
		/>
		<sgdf-date-time-picker
			data-test-id="project-information-fields-end-date-time-picker"
			appSgdfField
			with-time
			value-format="separate"
			[label]="'projects.form.end-datetime' | transloco"
			[formField]="form().endDateTime"
			[appFieldError]="form().endDateTime"
			translationPrefix="projects.form.error.end-datetime"
		/>
	</div>
</div>

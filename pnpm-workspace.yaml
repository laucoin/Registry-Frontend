allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - eslint@10.8.0
overrides:
  # GHSA-rgw5-rvv9-x895: DoS via unbounded intermediate arrays, pulled in transitively through
  # eslint's minimatch (dev tooling only, not part of the production bundle).
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9"

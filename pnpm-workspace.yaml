  "vite@>=8.3.0 <8.3.3": ">=8.3.3"
  "@vitest/mocker@<4.1.12": ">=4.1.12"
  "zod@<4.6.6": ">=4.6.6"
  "undici@>=8.0.0 <8.12.2": ">=8.12.2"
  "fast-uri@<3.1.9": ">=3.1.9"
autoInstallPeers: false

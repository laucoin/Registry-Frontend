allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - eslint@10.8.0
overrides:
  # GHSA-rgw5-rvv9-x895: DoS via unbounded intermediate arrays, pulled in transitively through
  # eslint's minimatch (dev tooling only, not part of the production bundle).
  'brace-expansion@>=4.0.0 <5.0.9': '>=5.0.9'
  'vite@>=8.3.0 <8.3.3': '>=8.3.3'
  '@vitest/mocker@<4.1.12': '>=4.1.12'
  'zod@<4.6.6': '>=4.6.6'
  'undici@>=8.0.0 <8.12.2': '>=8.12.2'
  'fast-uri@<3.1.9': '>=3.1.9'
  # GHSA-g3hv-75wg-m249 : déni de service par amplification des globparts, tiré par ESLint (outillage de dev, absent du bundle).
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
autoInstallPeers: false
